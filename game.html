function spawnBullet(x, y, vx, origin, pierce = false) {
    const bullet = getBullet().init(x, y, vx, origin, pierce);
    bullets.push(bullet);
    // --- SOUND: Shot ---
    // Play sound from the origin's position (x, y)
    soundManager.playSound('shot', x, y);
}

function spawnExplosion(x, y) {
    // Explosion init method now handles playing the 'incoming' sound if close
    const explosion = getExplosion().init(x, y);
    explosions.push(explosion);
}

function destroyDecorationsInBlast(x, y) {
    let writeIndex = 0;
    for (let i = 0; i < battlefieldDecorations.length; i++) {
        const decoration = battlefieldDecorations[i];
        // Comme pour un soldat, c'est le centre réel de l'objet qui doit être
        // compris dans le souffle : un simple contact avec le bord ne suffit pas.
        if (getDistance(decoration.x, decoration.y, x, y) < EXPLOSION_RADIUS) {
            battlefieldDecorationPool.push(decoration);
        } else {
            battlefieldDecorations[writeIndex++] = decoration;
        }
    }
    battlefieldDecorations.length = writeIndex;
}

function removeDecorationsWhoseBaseIsBlocked() {
    let writeIndex = 0;
    for (let i = 0; i < battlefieldDecorations.length; i++) {
        const decoration = battlefieldDecorations[i];
        if (decorationBaseOverlapsObstacle(
            decoration.x,
            decoration.y,
            decoration.width,
            decoration.height,
            true
        )) {
            battlefieldDecorationPool.push(decoration);
        } else {
            battlefieldDecorations[writeIndex++] = decoration;
        }
    }
    battlefieldDecorations.length = writeIndex;
}

function applyBlast(x, y) {
    // Check player collision
    const dPlayer = getDistance(player.centerX, player.centerY, x, y);
    if (player.alive && dPlayer < EXPLOSION_RADIUS) {
        player.alive = false; // Player killed
        // --- SOUND: Death ---
        soundManager.playSound('death', player.centerX, player.centerY);
        gameOver();
    }

    // Check ally collisions
    for (const ally of allies) {
        if (ally.alive) {
            const dAlly = getDistance(ally.centerX, ally.centerY, x, y);
            if (dAlly < EXPLOSION_RADIUS) {
                ally.alive = false; // Ally is killed by explosion
                // --- SOUND: Death ---
                soundManager.playSound('death', ally.centerX, ally.centerY);
            }
        }
    }

    // Check enemy collisions
    for (const enemy of enemies) {
        if (enemy.alive) {
            const dEnemy = getDistance(enemy.centerX, enemy.centerY, x, y);
            if (dEnemy < EXPLOSION_RADIUS) {
                enemy.alive = false; // Enemy is killed by explosion
                // --- SOUND: Death ---
                soundManager.playSound('death', enemy.centerX, enemy.centerY);
            }
        }
    }

    // Arbres, croix, piquets, armes et autres éléments de deco.png sont
    // soufflés s'ils se trouvent réellement dans la zone létale de l'obus.
    destroyDecorationsInBlast(x, y);

    // Check barbed wire destruction (optional, uncomment if explosions destroy wire)
    /*barbedWires.forEach(barbed => {
        if (barbed.alive) {
             const dBarbed = Math.hypot(barbed.centerX - x, barbed.centerY - y);
             // Consider barbed wire destroyed if its center is within blast radius
             if (dBarbed < EXPLOSION_RADIUS) {
                 barbed.alive = false; // Barbed wire is destroyed by explosion
             }
        }
    });*/
}

function updateGame(dt) {
    const dtSec = dt / 1000;
    const currentWorldSpeed = getCurrentWorldSpeed();
    worldScroll += currentWorldSpeed * dtSec;

    // ── NOUVEAU : faire défiler les cratères décoratifs ──
    const decorativeCraterDx = currentWorldSpeed * dtSec;
    for (const crater of decorativeCraters) {
        crater.x -= decorativeCraterDx;
        for (const point of crater.pts) point.x -= decorativeCraterDx;
    }
    // Retirer les cratères sortis sans recréer un tableau à chaque image.
    let decorativeWriteIndex = 0;
    for (let i = 0; i < decorativeCraters.length; i++) {
        const crater = decorativeCraters[i];
        if (crater.x + crater.radius > 0) {
            decorativeCraters[decorativeWriteIndex++] = crater;
        } else {
            decorativeCraterPool.push(crater);
        }
    }
    decorativeCraters.length = decorativeWriteIndex;

    // ── Spawn continu de cratères décoratifs ──
    nextDecorativeCraterTime -= dt;
    if (nextDecorativeCraterTime <= 0) {
        const radius = randomDecorativeCraterRadius();
        const craterX = canvas.width + RUNNER_PRELOAD_MARGIN + radius;
        const craterY = findStaticCraterPlacementY(
            craterX,
            randomRange(0, canvas.height),
            radius
        );
        if (craterY !== null) {
            decorativeCraters.push(makeCrater(craterX, craterY, radius));
        }
        // Réinitialise le timer
        nextDecorativeCraterTime = randomRange(
            DECORATIVE_CRATER_SPAWN_MIN,
            DECORATIVE_CRATER_SPAWN_MAX
        );
    }

    // Les petits éléments de deco.png suivent exactement le défilement du sol.
    let decorationWriteIndex = 0;
    for (let i = 0; i < battlefieldDecorations.length; i++) {
        const decoration = battlefieldDecorations[i];
        decoration.x -= decorativeCraterDx;
        if (decoration.x + decoration.width * 0.75 > 0) {
            battlefieldDecorations[decorationWriteIndex++] = decoration;
        } else {
            battlefieldDecorationPool.push(decoration);
        }
    }
    battlefieldDecorations.length = decorationWriteIndex;

    nextDecorationTime -= dt;
    if (nextDecorationTime <= 0) {
        spawnBattlefieldDecoration(
            canvas.width + RUNNER_PRELOAD_MARGIN + 70,
            randomRange(25, Math.max(25, canvas.height - 25))
        );
        nextDecorationTime = randomRange(DECORATION_SPAWN_MIN, DECORATION_SPAWN_MAX);
    }
    // ─────────────────────────────────────────

    // --- World Scrolling ---
    // Move trenches, barbed wire, and anything static with the current world speed
    nextTrenchX -= currentWorldSpeed * dtSec;

    // --- Trench Generation ---
    // Check if it's time to spawn a new trench segment
    if (nextTrenchX <= canvas.width) {
        // Spawn a trench just off-screen right
        const trenchX = canvas.width + Math.max(
            RUNNER_PRELOAD_MARGIN,
            randomRange(650, 900)
        );
        spawnTrench(trenchX);

        // Spawn barbed wire randomly near the new trench location's X
        // —————— Génération de lignes de barbelés ——————
        // — Génération de colonnes verticales de barbelés —
        // Nombre de colonnes de chaque côté (gauche et droite)
        const colsLeft  = randomRange(3, 10);
        const colsRight = randomRange(2, 4);

        // Fonction utilitaire pour créer une colonne à un X donné
        function spawnVerticalColumn(x) {
            // Espacement vertical régulier entre chaque barbelé
            const spacingY = 100 + randomRange(-10,10);
            // Y de départ choisi aléatoirement pour décaler un peu la colonne
            const startY = randomRange(0, canvas.height);
            // On répartit jusqu'en bas de l'écran
            for (let y = startY; y < randomRange(351,2151); y += spacingY) {
                // Ajustement pour que y corresponde au sommet du barbelé
                const topY = y - BARBED_HEIGHT/2;
                barbedWires.push(getBarbedWire().init(x + randomRange(-10,10), topY));
            }
        }

        // Colonnes à gauche de la tranchée
        for (let i = 0; i < colsLeft; i++) {
            const xLeft = trenchX - randomRange(10, 600);
            spawnVerticalColumn(xLeft);
        }

        // Colonnes à droite de la tranchée
        for (let i = 0; i < colsRight; i++) {
            const xRight = trenchX + TRENCH_WIDTH + randomRange(350, 600);
            spawnVerticalColumn(xRight);
        }

        // Spawn enemies near the new trench
        const enemyCount = ENEMY_SPAWN_COUNT_BASE + score * ENEMY_SPAWN_COUNT_PER_SCORE;
        const enemySpawnX = trenchX + (TRENCH_WIDTH - PLAYER_WIDTH) / 2 + randomRange(-10,-2); // Spawn in the trench
        const enemySpacingY = canvas.height / Math.max(1, enemyCount); // Distribute enemies vertically
        for (let i = 0; i < enemyCount; i++) {
            enemies.push(getEnemy().init(enemySpawnX, i * enemySpacingY + randomRange(-enemySpacingY, enemySpacingY) ));
        }

        // Schedule the next trench spawn relative to the *new* trench's position
        nextTrenchX = trenchX + TRENCH_WIDTH + randomRange(TRENCH_MIN_DIST, TRENCH_MAX_DIST) + 100;
    }

    // Move existing trenches and remove if off-screen
    for (const trench of trenches) trench.x -= currentWorldSpeed * dtSec;
    let trenchWriteIndex = 0;
    for (let i = 0; i < trenches.length; i++) {
        const trench = trenches[i];
        if (trench.x + TRENCH_WIDTH > 0) {
            trenches[trenchWriteIndex++] = trench;
        } else {
            trenchPool.push(trench);
        }
    }
    trenches.length = trenchWriteIndex;

    // Check for trench scoring and reinforcement spawning
    for (const t of trenches) {
        // Player passes trench when their X is past the trench's X + width + offset
        if (!t.counted && player.x > t.x + TRENCH_WIDTH + TRENCH_SCORE_DIST_OFFSET) {
            t.counted = true;
            score++;
            updateScore();

            // --- SOUND: Trench Capture ---
            soundManager.playSound('trenchCapture');

            // Spawn reinforcements
            const reinforcements = Math.max(0, ALLY_REINFORCEMENT_BASE - score); // 10 - score, minimum 0
            const spawnAreaHeight = canvas.height; // Reinforcements can appear anywhere vertically
            const spawnX = -45 // Appear slightly behind player
            const allySpacingY = spawnAreaHeight / Math.max(1, reinforcements);

            for (let i = 0; i < reinforcements; i++) {
                 // Spawn allies dispersed vertically behind the player
                allies.push(getAlly().init(
                    spawnX + randomRange(-20, 20),
                    i * allySpacingY + randomRange(-allySpacingY/4, allySpacingY/4)
                ));
            }
        }
    }


    // --- Random Explosion Spawning ---
    timeSinceLastExplosion += dt;
    if (timeSinceLastExplosion >= nextExplosionTime) {
        // Spawn an explosion somewhere on screen
        const explosionX = randomRange(0 - EXPLOSION_RADIUS, canvas.width + EXPLOSION_RADIUS); // Avoid spawning right on player's X
        const explosionY = randomRange(-60, canvas.height + EXPLOSION_RADIUS); // Spawn within bounds
        spawnExplosion(explosionX, explosionY);

        // Schedule next explosion
        timeSinceLastExplosion = 0;
        nextExplosionTime = randomRange(EXPLOSION_SPAWN_INTERVAL_MIN, EXPLOSION_SPAWN_INTERVAL_MAX);
    }

    // --- Update Entities ---
    if (player.alive) player.update(dt);
    const soldierWorldSpeed = getCurrentWorldSpeed();

    // Les alliés détectent les barbelés avant leur déplacement horizontal,
    // comme auparavant. L'index reflète donc exactement cet état de l'image.
    rebuildBarbedSpatialIndex();
    for (const ally of allies) if (ally.alive) ally.update(dt, soldierWorldSpeed);
    for (const enemy of enemies) if (enemy.alive) enemy.update(dt, soldierWorldSpeed);
    for (const bullet of bullets) if (bullet.alive) bullet.update(dt);
    for (const explosion of explosions) if (explosion.alive) explosion.update(dt);
    const barbedWorldSpeed = getCurrentWorldSpeed();
    for (const barbed of barbedWires) if (barbed.alive) barbed.update(dt, barbedWorldSpeed);
    // Les collisions utilisent ensuite leurs nouvelles positions.
    rebuildBarbedSpatialIndex();
    // Une tranchée ou une colonne de barbelés peut être créée après un décor.
    // Dans ce cas, le décor encore hors champ cède la place à l'obstacle.
    removeDecorationsWhoseBaseIsBlocked();

    // --- Collision Detection ---

    // Bullet collisions
    for (const bullet of bullets) {
        if (!bullet.alive) continue;

        // --- SOUND: Bullet Whiz-by ---
        // Check for enemy bullets passing close to the player
        if (bullet.origin === 'enemy' && player.alive && !bullet.whizzed) {
            const WHIZ_THRESHOLD_Y = 30; // Vertical distance threshold
            const WHIZ_THRESHOLD_X_START = player.x - 50; // Start checking before player
            const WHIZ_THRESHOLD_X_END = player.right + 50; // Stop checking after player

            // Check if bullet is horizontally near the player and vertically aligned
            if (bullet.x > WHIZ_THRESHOLD_X_START && bullet.x < WHIZ_THRESHOLD_X_END &&
                Math.abs(bullet.centerY - player.centerY) < WHIZ_THRESHOLD_Y)
            {
                // Check if it's actually moving towards the player's horizontal area
                // (vx < 0 for enemy bullets)
                if (bullet.vx < 0) {
                    soundManager.playSound('whiz', bullet.x, bullet.y);
                    bullet.whizzed = true; // Play sound only once per bullet
                }
            }
        }


        if (bullet.origin === 'ally') {
            // Ally bullets hit enemies
            for (const enemy of enemies) {
                if (enemy.alive && bullet.intersects(enemy)) {
                    enemy.alive = false; // Enemy killed
                    // --- SOUND: Death ---
                    soundManager.playSound('death', enemy.centerX, enemy.centerY);
                    if (!bullet.pierce) {
                        bullet.alive = false; // Non-piercing bullets are destroyed on hit
                    }
                    // If piercing, it continues and can hit other enemies
                }
            }
        } else { // origin === 'enemy'
            // Enemy bullets hit player
            if (player.alive && bullet.intersects(player)) {
                player.alive = false; // Player killed
                // --- SOUND: Death ---
                soundManager.playSound('death', player.centerX, player.centerY);
                bullet.alive = false; // Bullet is destroyed on hit
                gameOver();
            }

            // Enemy bullets hit allies
            for (const ally of allies) {
                if (ally.alive && bullet.intersects(ally)) {
                    ally.alive = false; // Ally killed
                    // --- SOUND: Death ---
                    soundManager.playSound('death', ally.centerX, ally.centerY);
                    bullet.alive = false;
                }
            }
        }
    }

    // Player vs Barbed Wire collision
    if (player.alive && !player.isCrawling) { // Only check if player is standing
        applyBarbedWireDamage(player, true);
    }

     // Allies vs Barbed Wire collision
     for (const ally of allies) {
        if (ally.alive && !ally.isCrawling) { // Only check if ally is standing
             applyBarbedWireDamage(ally);
         }
     }

     // Enemies vs Barbed Wire collision (as per guide, enemies don't crawl and are vulnerable)
     for (const enemy of enemies) {
         if (enemy.alive) { // Assuming enemies never crawl
              applyBarbedWireDamage(enemy);
          }
      }


    // --- Cleanup (Remove dead/off-screen entities) ---

    // Filter out dead entities and return bullets/explosions to pools
    let bulletWriteIndex = 0;
    for (let i = 0; i < bullets.length; i++) {
        const bullet = bullets[i];
        if (bullet.alive) {
            bullets[bulletWriteIndex++] = bullet;
        } else {
            returnBullet(bullet);
        }
    }
    bullets.length = bulletWriteIndex;

    let explosionWriteIndex = 0;
    for (let i = 0; i < explosions.length; i++) {
        const explosion = explosions[i];
        if (explosion.alive) {
            explosions[explosionWriteIndex++] = explosion;
        } else {
            returnExplosion(explosion);
        }
    }
    explosions.length = explosionWriteIndex;

    let allyWriteIndex = 0;
    for (let i = 0; i < allies.length; i++) {
        const ally = allies[i];
        if (ally.alive && ally.x < canvas.width + ally.w) {
            allies[allyWriteIndex++] = ally;
        } else {
            returnAlly(ally);
        }
    }
    allies.length = allyWriteIndex;

    let enemyWriteIndex = 0;
    for (let i = 0; i < enemies.length; i++) {
        const enemy = enemies[i];
        if (enemy.alive && enemy.x + enemy.w > 0) {
            enemies[enemyWriteIndex++] = enemy;
        } else {
            returnEnemy(enemy);
        }
    }
    enemies.length = enemyWriteIndex;

    let barbedWriteIndex = 0;
    for (let i = 0; i < barbedWires.length; i++) {
        const barbed = barbedWires[i];
        if (barbed.alive && barbed.x + barbed.w > 0) {
            barbedWires[barbedWriteIndex++] = barbed;
        } else {
            returnBarbedWire(barbed);
        }
    }
    barbedWires.length = barbedWriteIndex;
}



/**
 * Dessine au contexte 2D un cratère irrégulier
 *  obj doit contenir : {x,y,radius,pts[]}
 */
 function drawCrater(ctx, obj){
    if (obj.renderCacheReady) {
        const smoothing = ctx.imageSmoothingEnabled;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(
            obj.renderCache,
            obj.x - obj.renderCacheOffset,
            obj.y - obj.renderCacheOffset,
            obj.renderCacheDisplaySize,
            obj.renderCacheDisplaySize
        );
        ctx.imageSmoothingEnabled = smoothing;
    } else {
        drawCraterVector(ctx, obj);
    }
}

function traceTrenchArea(targetCtx, leftPoints, leftBaseX, leftScale, rightPoints, rightBaseX, rightScale) {
    targetCtx.beginPath();
    for (let i = 0; i < leftPoints.length; i++) {
        const point = leftPoints[i];
        const x = leftBaseX + point.dx * leftScale;
        if (i === 0) targetCtx.moveTo(x, point.y);
        else targetCtx.lineTo(x, point.y);
    }
    for (let i = rightPoints.length - 1; i >= 0; i--) {
        const point = rightPoints[i];
        targetCtx.lineTo(rightBaseX + point.dx * rightScale, point.y);
    }
    targetCtx.closePath();
}

function traceTrenchEdge(targetCtx, points, baseX, scale) {
    targetCtx.beginPath();
    for (let i = 0; i < points.length; i++) {
        const point = points[i];
        const x = baseX + point.dx * scale;
        if (i === 0) targetCtx.moveTo(x, point.y);
        else targetCtx.lineTo(x, point.y);
    }
}

function drawGroundTextureTiles(targetCtx, minX = 0, maxX = canvas.width) {
    if (!groundTextureLoaded) return;

    const tileWidth = groundTextureTile.width;
    const tileHeight = groundTextureTile.height;
    const groundOffsetX = -Math.floor(worldScroll % tileWidth);
    const firstTileIndex = Math.floor(worldScroll / tileWidth);

    targetCtx.save();
    targetCtx.imageSmoothingEnabled = false;
    let column = 0;
    for (let x = groundOffsetX; x < maxX; x += tileWidth, column++) {
        if (x + tileWidth <= minX) continue;

        let row = 0;
        for (let y = 0; y < canvas.height; y += tileHeight, row++) {
            const flipX = (firstTileIndex + column) % 2 !== 0;
            const flipY = row % 2 !== 0;

            targetCtx.save();
            targetCtx.translate(x + (flipX ? tileWidth : 0), y + (flipY ? tileHeight : 0));
            targetCtx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
            targetCtx.drawImage(groundTextureTile, 0, 0);
            targetCtx.restore();
        }
    }
    targetCtx.restore();
}

function drawLargeGroundTextureLayer(targetCtx) {
    if (!largeGroundTextureLoaded || canvas.height <= 0) return;

    const scale = canvas.height / largeGroundTextureImage.naturalHeight;
    const layerWidth = Math.max(1, Math.ceil(largeGroundTextureImage.naturalWidth * scale));

    // Une rotation d'écran change la largeur rendue de l'image. On reconstruit
    // alors la petite liste de tuiles autour de la portion de terrain visible.
    if (largeGroundTextureRenderWidth !== layerWidth || largeGroundTextureTiles.length === 0) {
        largeGroundTextureRenderWidth = layerWidth;
        largeGroundTextureTiles.length = 0;
        const averageOverlap = (LARGE_GROUND_TEXTURE_MIN_OVERLAP + LARGE_GROUND_TEXTURE_MAX_OVERLAP) * 0.5;
        const averageStep = Math.max(1, layerWidth - averageOverlap);
        const firstWorldX = worldScroll - (worldScroll % averageStep);
        largeGroundTextureTiles.push({
            worldX: firstWorldX,
            opacity: LARGE_GROUND_TEXTURE_MIN_OPACITY
                + Math.random() * (LARGE_GROUND_TEXTURE_MAX_OPACITY - LARGE_GROUND_TEXTURE_MIN_OPACITY),
            overlapAfter: randomRange(LARGE_GROUND_TEXTURE_MIN_OVERLAP, LARGE_GROUND_TEXTURE_MAX_OVERLAP)
        });
    }

    // Chaque tuile nouvellement créée reçoit une opacité et un chevauchement
    // qui lui sont propres. Ces valeurs sont conservées pour éviter tout
    // scintillement d'une image à l'autre pendant le défilement.
    const preloadWorldRight = worldScroll + canvas.width + RUNNER_PRELOAD_MARGIN;
    while (true) {
        const lastTile = largeGroundTextureTiles[largeGroundTextureTiles.length - 1];
        const effectiveOverlap = Math.min(lastTile.overlapAfter, Math.max(0, layerWidth - 1));
        const nextWorldX = lastTile.worldX + layerWidth - effectiveOverlap;
        if (nextWorldX > preloadWorldRight) break;

        largeGroundTextureTiles.push({
            worldX: nextWorldX,
            opacity: LARGE_GROUND_TEXTURE_MIN_OPACITY
                + Math.random() * (LARGE_GROUND_TEXTURE_MAX_OPACITY - LARGE_GROUND_TEXTURE_MIN_OPACITY),
            overlapAfter: randomRange(LARGE_GROUND_TEXTURE_MIN_OVERLAP, LARGE_GROUND_TEXTURE_MAX_OVERLAP)
        });
    }

    while (largeGroundTextureTiles.length > 1 &&
           largeGroundTextureTiles[0].worldX + layerWidth <= worldScroll) {
        largeGroundTextureTiles.shift();
    }

    targetCtx.save();
    targetCtx.imageSmoothingEnabled = true;
    targetCtx.imageSmoothingQuality = 'high';

    // Le fond fin est déjà dessiné dessous. Les bords transparents des grandes
    // images se fondent grâce à leur chevauchement de 65 à 100 pixels.
    for (const tile of largeGroundTextureTiles) {
        const screenX = tile.worldX - worldScroll;
        if (screenX >= canvas.width || screenX + layerWidth <= 0) continue;
        targetCtx.globalAlpha = tile.opacity;
        targetCtx.drawImage(largeGroundTextureImage, screenX, 0, layerWidth, canvas.height);
    }

    targetCtx.restore();
}

function renderGame() {
   

    // Couleur de secours visible uniquement pendant le chargement de l'image.
    ctx.fillStyle = '#4a3f35';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Tuile de 627 × 627 px préparée une seule fois au chargement. Elle est
    // répétée dans les deux directions sans être redimensionnée à chaque image.
    drawGroundTextureTiles(ctx);

    // Calque panoramique transparent placé au-dessus de la texture fine du sol.
    drawLargeGroundTextureLayer(ctx);

    /* ---------- Débris et objets de deco.png, sous les obstacles ---------- */
    for (const decoration of battlefieldDecorations) {
        if (decoration.sprite.depthSorted) continue;
        const halfWidth = decoration.width * 0.75;
        const halfHeight = decoration.height * 0.75;
        if (decoration.x + halfWidth > 0 &&
            decoration.x - halfWidth < canvas.width &&
            decoration.y + halfHeight > 0 &&
            decoration.y - halfHeight < canvas.height) {
            drawBattlefieldDecoration(ctx, decoration);
        }
    }

    /* ---------- Tranchées hybrides : profondeur + contours irréguliers ---------- */
    for (const t of trenches) {
        if (t.x - TRENCH_VISUAL_OVERFLOW >= canvas.width ||
            t.x + TRENCH_WIDTH + TRENCH_VISUAL_OVERFLOW <= 0) continue;

        const variant = TRENCH_VISUAL_VARIANTS[t.visualVariant];
        const visualWidth = variant.width;
        const trenchX = t.x - (visualWidth - TRENCH_WIDTH) * 0.5;
        const floorWidth = variant.floorWidth;
        const leftBankWidth = (visualWidth - floorWidth) * 0.52;
        const floorX = trenchX + leftBankWidth;
        const rightBankX = floorX + floorWidth;
        const irregularity = variant.irregularity;

        // Talus gauche irrégulier : la lumière disparaît vers le fond.
        const leftBankGradient = ctx.createLinearGradient(trenchX, 0, floorX, 0);
        leftBankGradient.addColorStop(0, variant.left[0]);
        leftBankGradient.addColorStop(0.62, variant.left[1]);
        leftBankGradient.addColorStop(1, variant.left[2]);
        traceTrenchArea(
            ctx,
            t.leftPts, trenchX, irregularity * 0.72,
            t.leftPts, floorX, irregularity * 0.34
        );
        ctx.fillStyle = leftBankGradient;
        ctx.fill();

        // Fond encaissé, lui aussi délimité par deux lèvres différentes.
        const floorGradient = ctx.createLinearGradient(floorX, 0, rightBankX, 0);
        floorGradient.addColorStop(0, variant.floor[0]);
        floorGradient.addColorStop(0.5, variant.floor[1]);
        floorGradient.addColorStop(1, variant.floor[2]);
        traceTrenchArea(
            ctx,
            t.leftPts, floorX, irregularity * 0.34,
            t.rightPts, rightBankX, irregularity * 0.34
        );
        ctx.fillStyle = floorGradient;
        ctx.fill();

        // Même texture que le no man's land, parfaitement alignée avec lui,
        // puis fortement assombrie pour conserver l'impression d'encaissement.
        ctx.save();
        traceTrenchArea(
            ctx,
            t.leftPts, floorX, irregularity * 0.34,
            t.rightPts, rightBankX, irregularity * 0.34
        );
        ctx.clip();
        ctx.globalAlpha = 0.34;
        drawGroundTextureTiles(ctx, floorX - 8, rightBankX + 8);
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(10,7,6,0.52)';
        ctx.fillRect(floorX - 10, 0, floorWidth + 20, canvas.height);
        ctx.restore();

        // Talus droit plus clair et doté d'une silhouette indépendante.
        const rightEdgeX = trenchX + visualWidth;
        const rightBankGradient = ctx.createLinearGradient(rightBankX, 0, rightEdgeX, 0);
        rightBankGradient.addColorStop(0, variant.right[0]);
        rightBankGradient.addColorStop(0.38, variant.right[1]);
        rightBankGradient.addColorStop(1, variant.right[2]);
        traceTrenchArea(
            ctx,
            t.rightPts, rightBankX, irregularity * 0.34,
            t.rightPts, rightEdgeX, irregularity * 0.72
        );
        ctx.fillStyle = rightBankGradient;
        ctx.fill();

        // Ombre et lumière fines le long des deux lèvres intérieures.
        traceTrenchEdge(ctx, t.leftPts, floorX, irregularity * 0.34);
        ctx.strokeStyle = 'rgba(17,11,9,0.75)';
        ctx.lineWidth = 2;
        ctx.stroke();
        traceTrenchEdge(ctx, t.rightPts, rightBankX, irregularity * 0.34);
        ctx.strokeStyle = 'rgba(151,112,78,0.45)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Texture légère limitée à la silhouette irrégulière complète.
        ctx.save();
        traceTrenchArea(
            ctx,
            t.leftPts, trenchX, irregularity * 0.72,
            t.rightPts, rightEdgeX, irregularity * 0.72
        );
        ctx.clip();
        ctx.globalAlpha = 0.045;
        ctx.drawImage(noiseCanvas, trenchX - 8, 0, visualWidth + 16, canvas.height);
        ctx.restore();

        ctx.fillStyle = '#49352a';
        for (let i = 0; i < t.floorDebris.length; i += 4) {
            const debris = t.floorDebris[i];
            const debrisX = floorX + 4 + (i % 3) * Math.max(4, (floorWidth - 8) * 0.45);
            ctx.fillRect(debrisX, Math.round(debris.y), 1, Math.max(2, Math.round(debris.h * 0.3)));
        }

        // Quantité et longueur des traverses variables selon la tranchée.
        for (const plank of t.planks) {
            const plankY = plank.y;
            const plankH = Math.max(4, plank.h * 0.78);
            const plankX = trenchX + 1 + plank.leftInset;
            const plankWidth = visualWidth - 2 - plank.leftInset - plank.rightInset;
            ctx.fillStyle = '#3b281d';
            ctx.fillRect(plankX, plankY + plankH - 1, plankWidth, 2);
            ctx.fillStyle = '#6b4b32';
            ctx.fillRect(plankX, plankY, plankWidth, plankH - 1);
            ctx.fillStyle = '#94704b';
            ctx.fillRect(plankX + 1, plankY, plankWidth - 2, 1);

            ctx.fillStyle = '#28201a';
            for (const knot of plank.knots) {
                ctx.beginPath();
                ctx.arc(plankX + knot.dx / TRENCH_WIDTH * plankWidth,
                        plankY + knot.dy * 0.7, 1.2, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = '#b8aa86';
            for (const nail of plank.nails) {
                ctx.fillRect(
                    plankX + nail.dx / TRENCH_WIDTH * plankWidth - 0.75,
                    plankY + nail.dy * 0.7 - 0.75,
                    1.5,
                    1.5
                );
            }
        }
    }


    // … suite du dessin (cratères, entités, etc.) …


    
    // ── NOUVEAU : dessiner les cratères décoratifs ──
    ctx.fillStyle = 'rgba(80,80,80,1)';  // Couleur sombre/cratère

    // ── NOUVEAU : dégradé radial pour les cratères ──
    /* ---------- Cratères décoratifs ---------- */
    for (const c of decorativeCraters) {
        const visualRadius = c.radius * CRATER_VISUAL_RADIUS_FACTOR;
        if (c.x + visualRadius > 0 && c.x - visualRadius < canvas.width &&
            c.y + visualRadius > 0 && c.y - visualRadius < canvas.height) drawCrater(ctx, c);
    }
    
    // ────────────────────────────────────────────────
    // ────────────────────────────────────────────────

    // --- Cratères sous les persos (phase 'crater') ---
    for (const ex of explosions) {
        const visualRadius = ex.radius * CRATER_VISUAL_RADIUS_FACTOR;
        if (ex.phase === 'crater' && ex.alive &&
            ex.x + visualRadius > 0 && ex.x - visualRadius < canvas.width &&
            ex.y + visualRadius > 0 && ex.y - visualRadius < canvas.height) ex.draw();
    }

    // --- Soldats et obstacles verticaux triés ensemble par profondeur ---
    characterRenderOrder.length = 0;
    if (player && player.alive && player.right > 0 && player.x < canvas.width &&
        player.bottom > 0 && player.y < canvas.height) {
        characterRenderOrder.push(player);
    }
    for (const ally of allies) {
        if (ally.alive && ally.right > 0 && ally.x < canvas.width &&
            ally.bottom > 0 && ally.y < canvas.height) {
            characterRenderOrder.push(ally);
        }
    }
    for (const enemy of enemies) {
        if (enemy.alive && enemy.right > 0 && enemy.x < canvas.width &&
            enemy.bottom > 0 && enemy.y < canvas.height) {
            characterRenderOrder.push(enemy);
        }
    }
    for (const decoration of battlefieldDecorations) {
        if (!decoration.sprite.depthSorted) continue;
        const halfWidth = decoration.width * 0.75;
        const halfHeight = decoration.height * 0.75;
        if (decoration.x + halfWidth > 0 &&
            decoration.x - halfWidth < canvas.width &&
            decoration.y + halfHeight > 0 &&
            decoration.y - halfHeight < canvas.height) {
            characterRenderOrder.push(decoration);
        }
    }
    characterRenderOrder.sort(compareEntityDepth);
    for (const character of characterRenderOrder) character.draw();

    // --- Les barbelés restent au-dessus du sol et des personnages ---
    for (const barbed of barbedWires) {
        if (barbed.right > 0 && barbed.x < canvas.width &&
            barbed.bottom > 0 && barbed.y < canvas.height) barbed.draw();
    }

    // --- Flèches de tir au‑dessus de tout ---
    for (const bullet of bullets) {
        if (bullet.right > 0 && bullet.x < canvas.width &&
            bullet.bottom > 0 && bullet.y < canvas.height) bullet.draw();
    }

    // --- Ombres et explosions (phases shadow/blast) ---
    for (const ex of explosions) {
        if (ex.phase !== 'crater' && ex.alive &&
            ex.x + EXPLOSION_RADIUS > 0 && ex.x - EXPLOSION_RADIUS < canvas.width &&
            ex.y + EXPLOSION_RADIUS > 0 && ex.y - EXPLOSION_RADIUS < canvas.height) ex.draw();
    }

    // UI (score and message) is handled by HTML elements outside the canvas
}

// --- Main Game Loop ---
function gameLoop(time) {
    if (!lastTime) lastTime = time; // Initialize lastTime on the first frame
    // Un onglet masqué ou une image lourde peut retarder une frame. Sans cette
    // limite, le monde avancerait brutalement et les objets hors champ
    // pourraient se retrouver plusieurs dizaines de pixels dans la caméra.
    const dt = Math.min(time - lastTime, MAX_FRAME_DELTA);
    lastTime = time;
    processCraterCacheQueue();

    if (gameState === 'waitingCharge') {
        renderGame();                   // dessine décor + entités en attente
        requestAnimationFrame(gameLoop);
        return;
    }

    if (gameState === 'playing') {
        updateGame(dt);
        renderGame();

        if (player.alive) {
            requestAnimationFrame(gameLoop);
        } else {
            animationLoopRunning = false;
        }
    } else if (gameState === 'ready' || gameState === 'gameover') {
        // In ready or gameover state, just keep the loop running to listen for SPACE
        // We still call renderGame to potentially show the last frame or a static scene
        renderGame(); // Render the current state (e.g., game over screen or ready screen)
        requestAnimationFrame(gameLoop); // Keep loop alive to detect SPACE for reset
    }
}

// --- Initialization ---
// Wait for initial resize and set up message
//document.getElementById('message').style.display = 'block';
// Start game loop only when Space is pressed in 'ready' state (handled by key listener)

// Initial pool creation (already done in resetGame, but good to have here too if not resetting immediately)
// for(let i=0; i<BULLET_POOL_SIZE; i++) bulletPool.push(new Bullet());
// for(let i=0; i<EXPLOSION_POOL_SIZE; i++) explosionPool.push(new Explosion());

// Start the game loop in a paused state to listen for input
requestAnimationFrame(gameLoop);


})();
