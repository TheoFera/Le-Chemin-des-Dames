<script>
(function(){
const canvas = document.getElementById('game');
// Le jeu repeint tout le canvas à chaque image : le déclarer opaque évite au

};

};

groundTextureImage.onload = () => {
    groundTextureTile.width = Math.round(groundTextureImage.naturalWidth * GROUND_TEXTURE_SCALE);
    groundTextureTile.height = Math.round(groundTextureImage.naturalHeight * GROUND_TEXTURE_SCALE);
    const groundTextureCtx = groundTextureTile.getContext('2d');
    groundTextureCtx.imageSmoothingEnabled = true;
    groundTextureCtx.imageSmoothingQuality = 'high';
    groundTextureCtx.drawImage(
        groundTextureImage,
        0,
        0,
        groundTextureTile.width,
        groundTextureTile.height
    );
    groundTextureLoaded = true;
};
groundTextureImage.onerror = () => {
    console.error('Impossible de charger texture_sol.png');
};
groundTextureImage.src = 'images/texture_sol.png';

// Grande composition transparente superposée à la texture répétée. Sa hauteur
// suit toujours celle de l'écran afin de donner une cohérence globale au champ
// de bataille, sans masquer les détails de texture visibles en dessous.
const largeGroundTextureImage = new Image();
const LARGE_GROUND_TEXTURE_MIN_OPACITY = 0.8;
const LARGE_GROUND_TEXTURE_MAX_OPACITY = 1;
const LARGE_GROUND_TEXTURE_MIN_OVERLAP = 65;
const LARGE_GROUND_TEXTURE_MAX_OVERLAP = 100;
const largeGroundTextureTiles = [];
let largeGroundTextureRenderWidth = 0;
let largeGroundTextureLoaded = false;
largeGroundTextureImage.onload = () => { largeGroundTextureLoaded = true; };
largeGroundTextureImage.onerror = () => {
    console.error('Impossible de charger texture_sol_grande.png');
};
largeGroundTextureImage.src = 'images/texture_sol_grande.png';

// Éléments de décor vus du dessus. Seules les neuf zones réellement utiles
// de la planche sont dessinées ; la grande surface transparente est ignorée.
const decorationImage = new Image();
let decorationImageLoaded = false;
decorationImage.onload = () => { decorationImageLoaded = true; };
decorationImage.onerror = () => {

const DECORATION_SPRITES = [

    // Grand arbre mort et grande souche : visibles régulièrement, sans dominer

    { sx: 310, sy: 493, sw: 61,  sh: 98,  minScale: 0.70, maxScale: 0.88, weight: 4, depthSorted: true, isTree: true },
    // Repères verticaux : masque à gaz sur piquet et croix en bois.
    { sx: 399, sy: 303, sw: 29,  sh: 64,  minScale: 0.78, maxScale: 1.00, weight: 2, depthSorted: true, isMarker: true },
    { sx: 446, sy: 306, sw: 49,  sh: 60,  minScale: 0.74, maxScale: 0.96, weight: 4, depthSorted: true, isMarker: true }
];
const DECORATION_TOTAL_WEIGHT = DECORATION_SPRITES.reduce(
    (total, sprite) => total + sprite.weight,
    0
);
const DECORATION_SPAWN_MIN = 540;
const DECORATION_SPAWN_MAX = 1310;
const DECORATION_MAX_VISIBLE = 42;

// --- Sprite Map (Define coordinates of each sprite in sprites.png) ---
// You MUST adjust these values (sx, sy, sw, sh) based on YOUR sprites.png layout
// Note: These dimensions are the SOURCE dimensions in the sprite sheet.
// The sprites will be SCALED to the entity's hitbox dimensions (this.w, this.h)
const spriteMap = {

    player_running2: { sx: 222, sy: 520, sw: 231, sh: 246 },

    ally_crawling:   { sx: 314, sy: 232, sw: 355, sh: 186 }, // Assumed same as player crawling sprite
    ally_firing:   { sx: 486, sy: 0, sw: 228, sh: 238 },
    enemy_standing:  { sx: 0, sy: 249, sw: 255, sh: 262 }, // Note: Large dimensions, will be scaled
    barbed_wire:     { sx: 752, sy: 0, sw: 146, sh: 615 }, // Note: Large dimensions, will be scaled/stretched
};
const ALLY_RUN_FRAMES = [spriteMap.ally_running1, spriteMap.ally_running2];

// --- Game Constants (Centralized) ---
const WORLD_SPEED = 80; // px/s (terrain scrolling speed when player is standing/not charging)
const RUNNER_PRELOAD_MARGIN = 240; // Zone de préparation invisible à droite de la caméra
const MAX_FRAME_DELTA = 50; // Évite les grands bonds après un ralentissement ou un changement d'onglet
const PLAYER_X = 80; // Fixed player horizontal position
const PLAYER_SPEED_Y = 100; // px/s vertical
const PLAYER_WIDTH = 24; // Hitbox width
const PLAYER_HEIGHT_STANDING = 32; // Hitbox height standing
const PLAYER_HEIGHT_CRAWLING = 24; // Hitbox height crawling
const PLAYER_WIDTH_CRAWLING = 34; // ← largeur souhaitée quand on rampe
const PLAYER_CHARGE_DURATION = 300; // ms to charge a shot
const CRAWL_SPEED_FACTOR = 0.5;  // 50 % de la vitesse normale quand on rampe (affecte monde pour joueur, et allié pour allié)
const SHOOT_SPEED_FACTOR = 0.2; // 20 % de la vitesse normale quand le joueur charge (affecte monde)

const BULLET_SPEED = 850; // px/s
const BULLET_WIDTH = 8;
const BULLET_HEIGHT = 3;
const BULLET_POOL_SIZE = 60; // Max bullets in pool

const BARBED_WIDTH = 20; // Hitbox width
const BARBED_HEIGHT = 100; // Base hitbox height (can vary)
const BARBED_POOL_SIZE = 400;
const BARBED_SPATIAL_CELL_SIZE = 128;
const BARBED_SPATIAL_KEY_OFFSET = 16384;

const TRENCH_WIDTH = 40;
const TRENCH_MIN_DIST = 600; // Min pixels between trench spawns
const TRENCH_MAX_DIST = 800; // Max pixels between trench spawns
const TRENCH_SCORE_DIST_OFFSET = 0; // Player needs to pass trench.x + width + offset to score
const TRENCH_VISUAL_OVERFLOW = 20;
const TRENCH_VISUAL_VARIANTS = [
    {
        width: 58, floorWidth: 26, irregularity: 0.8, plankMin: 5, plankMax: 7,
        left: ['#6b513e', '#493428', '#211713'],
        floor: ['#17110e', '#30231c', '#120d0b'],
        right: ['#2b1e18', '#604735', '#80644d']
    },
    {
        width: 66, floorWidth: 30, irregularity: 1.35, plankMin: 4, plankMax: 6,
        left: ['#725741', '#4d382a', '#251914'],
        floor: ['#18110e', '#392820', '#110c0a'],
        right: ['#2c1e17', '#684b36', '#88684e']
    },
    {
        width: 54, floorWidth: 22, irregularity: 0.5, plankMin: 7, plankMax: 9,
        left: ['#604a3a', '#402f26', '#1d1511'],
        floor: ['#130f0c', '#28201a', '#0f0b09'],
        right: ['#241a15', '#574332', '#755c48']
    }
];
const CRATER_VISUAL_RADIUS_FACTOR = 1.22; // Marge maximale des contours irréguliers
const CRATER_PIXEL_SCALE = 3;

const EXPLOSION_RADIUS = 80; // Max radius for blast and crater
const EXPLOSION_SHADOW_DURATION = 3000; // ms
const EXPLOSION_BLAST_DURATION = 200; // ms
const EXPLOSION_CRATER_DURATION = 3000; // ms (how long crater stays visible off-screen before pooling/removal)
const EXPLOSION_SPAWN_INTERVAL_MIN = 300; // ms min between random explosions
const EXPLOSION_SPAWN_INTERVAL_MAX = 2500; // ms max between random explosions
const EXPLOSION_POOL_SIZE = 40; // Max explosions in pool

// --- Decorative crater spawn intervals (ms) ---
const DECORATIVE_CRATER_SPAWN_MIN = 300;
const DECORATIVE_CRATER_SPAWN_MAX = 5000;

const ALLY_COUNT_INITIAL = 40 + randomRange(1,10);
const ALLY_POOL_SIZE = 140;
const ALLY_REINFORCEMENT_BASE = 15; // Base reinforcements (minus score)
const ALLY_VERTICAL_SPEED = 40; // px/s random vertical move
const ALLY_RANDOM_MOVE_INTERVAL = 2300; // ms how often ally changes random vertical speed
const ALLY_SHOOT_COOLDOWN_MIN = 2000; // ms 
const ALLY_SHOOT_COOLDOWN_MAX = 12000; // ms
const ALLY_CHARGE_DURATION = 2000; // ms for ally charged shot
const ALLY_BARBED_WIRE_DETECTION_DIST = 90; // px distance ahead/behind to check for barbed wire
const ALLY_SPEED_VARIATION = 0.05; // +/- 5% variation in base speed relative to world
const ALLY_CRATER_DETECTION_RADIUS = -20; // px radius around crater center to trigger check (0 means check against explosion radius)
const ALLY_RANDOM_CRAWL_DURATION = 2000; // ms duration of random crawl
const ALLY_CRAWL_CHANCE_IN_CRATER = 0.008; // 0.8% chance per update cycle when near crater

const ENEMY_SPAWN_COUNT_BASE = 8; // Base enemies per trench spawn
const ENEMY_SPAWN_COUNT_PER_SCORE = 1; // Additional enemies per score point
//const ENEMY_VERTICAL_CHASE_SPEED = 70; // px/s vertical move to chase player (currently unused)
const ENEMY_SHOOT_COOLDOWN_MIN = 2000; // ms
const ENEMY_SHOOT_COOLDOWN_MAX = 5000; // ms
const ENEMY_SHOOT_ALIGNMENT_THRESHOLD = 90; // px vertical difference to allow shooting
const ENEMY_POOL_SIZE = 100;


// --- Game State Variables ---
let gameState = 'ready';
let score = 0;
let lastTime = 0;
let animationLoopRunning = true;
let nextTrenchX = TRENCH_MIN_DIST; // Where the next trench will be spawned (relative to canvas right edge initially)
let timeSinceLastExplosion = 0;
let nextExplosionTime = 0;
let startTimer = 0;         // délai avant défilement
let worldScroll = 0;

let chargeDelayActive = false;   // ← empêche plusieurs déclenchements

// --- Entity Lists ---
let player;
let trenches = [];
let barbedWires = [];
let bullets = [];
let allies = [];
let enemies = [];
let explosions = [];
let decorativeCraters = [];
let battlefieldDecorations = [];

let nextDecorativeCraterTime = 0;
let nextDecorationTime = 0;

// --- Object Pools ---
let bulletPool = [];
let explosionPool = [];
let barbedWirePool = [];
let enemyPool = [];
let allyPool = [];
let trenchPool = [];
let decorativeCraterPool = [];
let battlefieldDecorationPool = [];
const pendingCraterCaches = [];
let pendingCraterCacheIndex = 0;

// Index spatial réutilisable. Il ne change aucune collision : il évite
// seulement de tester les barbelés situés dans une autre zone du terrain.
const barbedSpatialBuckets = new Map();
const usedBarbedSpatialBuckets = [];
let barbedSpatialQueryId = 0;
const characterRenderOrder = [];

// --- Input Handling ---
const keys = {};
const TOUCH_VERTICAL_DEAD_ZONE = 18;
const TOUCH_VERTICAL_FULL_SPEED_DISTANCE = 82;
const TOUCH_MAX_SPEED_Y = PLAYER_SPEED_Y * 1.4;
const TOUCH_SWIPE_DISTANCE = 45;
const TOUCH_SWIPE_DOMINANCE = 1.3;
const TOUCH_SWIPE_HYSTERESIS = 14;

// Chaque contact est affecté une fois pour toutes à la moitié où il a commencé.
// La posture tactile reste mémorisée après le relâchement du pouce gauche.
const touchControls = {
    leftPointerId: null,
    rightPointerId: null,
    verticalSpeed: 0,
    isCrawling: false,
    leftStartY: 0,
    leftLastX: 0,
    leftLastY: 0,
    postureAnchorX: 0,
    postureAnchorY: 0,
    lockedSwipeDirection: 0
};

// Le clavier et le tactile peuvent charger simultanément sans que le
// relâchement d'une source interrompe l'autre.
const chargeInputs = {
    keyboard: false,
    touch: false
};

function beginPlayerCharge(source) {
    chargeInputs[source] = true;
    if (gameState !== 'playing' || !player || !player.alive) return;

    if (!player.isCharging) {
        player.isCharging = true;
        player.chargeTime = 0;
    }
}

function endPlayerCharge(source, shouldFire = true) {
    chargeInputs[source] = false;
    if (chargeInputs.keyboard || chargeInputs.touch) return;
    if (gameState !== 'playing' || !player || !player.isCharging) return;

    if (shouldFire && player.chargeTime >= PLAYER_CHARGE_DURATION) {
        spawnBullet(player.x + player.w, player.centerY, BULLET_SPEED, 'ally', false);
    }
    player.isCharging = false;
    player.chargeTime = 0;
}

function launchAssault() {
    if (gameState !== 'waitingCharge' || chargeDelayActive) return;

    chargeDelayActive = true;
    document.getElementById('message').innerText = 'Chargez !';
    soundManager.playSound('startWhistle');

    setTimeout(() => {
        document.getElementById('message').style.display = 'none';
        gameState = 'playing';
        player.isWaiting = false;

        const BASE = 40;
        const STEP = 20;
        allies.forEach((a, idx) => {
            const jitter = Math.random() * 20;
            setTimeout(() => a.isWaiting = false, BASE + idx * STEP + jitter);
        });

        // Si le pouce droit est resté posé pendant le coup de sifflet,
        // le chargement commence dès que la partie devient active.
        if (touchControls.rightPointerId !== null) beginPlayerCharge('touch');
        chargeDelayActive = false;
    }, 1000);
}

window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyS','KeyA','KeyD'].includes(e.code)) {
        e.preventDefault();
    }

    /* ---------- 1) lancement / reset ---------- */
    if (gameState === 'ready') {
        startGame();
        return;
    }
    if (gameState === 'gameover' && e.code === 'Space') {
        resetGame();
        return;
    }

    /* ---------- 2) attente du coup de sifflet ---------- */
    if (gameState === 'waitingCharge' && e.code === 'ArrowRight') {
        launchAssault();
        return;
    }

    /* ---------- 3) actions en cours de partie ---------- */
    if (gameState === 'playing') {
        if (e.code === 'Space' && !e.repeat) beginPlayerCharge('keyboard');
    }
});


window.addEventListener('keyup', e => {
    keys[e.code] = false;
    if (e.code === 'Space') endPlayerCharge('keyboard');
});

function pointerPosition(event) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (event.clientX - rect.left) * (canvas.width / rect.width),
        y: (event.clientY - rect.top) * (canvas.height / rect.height),
        isLeftHalf: event.clientX < rect.left + rect.width / 2
    };
}

function updateTouchVerticalSpeed(y) {
    const deltaY = y - touchControls.leftStartY;
    const distance = Math.abs(deltaY);
    if (distance <= TOUCH_VERTICAL_DEAD_ZONE) {
        touchControls.verticalSpeed = 0;
        return;
    }

    const usableDistance = distance - TOUCH_VERTICAL_DEAD_ZONE;
    const fullSpeedDistance = TOUCH_VERTICAL_FULL_SPEED_DISTANCE - TOUCH_VERTICAL_DEAD_ZONE;
    const intensity = Math.min(1, usableDistance / fullSpeedDistance);
    touchControls.verticalSpeed = Math.sign(deltaY) * TOUCH_MAX_SPEED_Y * intensity;
}

function updateTouchPosture(x, y) {
    const stepX = x - touchControls.leftLastX;
    const stepY = y - touchControls.leftLastY;

    // Un déplacement nettement vertical devient une nouvelle origine du geste
    // de posture. Une longue montée/descente ne gêne donc pas le swipe suivant.
    if (Math.abs(stepY) > Math.abs(stepX) * TOUCH_SWIPE_DOMINANCE) {
        touchControls.postureAnchorX = x;
        touchControls.postureAnchorY = y;
    }

    const deltaX = x - touchControls.postureAnchorX;
    const deltaY = y - touchControls.postureAnchorY;

    if (
        touchControls.lockedSwipeDirection !== 0 &&
        deltaX * touchControls.lockedSwipeDirection <= -TOUCH_SWIPE_HYSTERESIS
    ) {
        touchControls.lockedSwipeDirection = 0;
    }

    const direction = Math.sign(deltaX);
    const isHorizontalSwipe =
        Math.abs(deltaX) >= TOUCH_SWIPE_DISTANCE &&
        Math.abs(deltaX) > Math.abs(deltaY) * TOUCH_SWIPE_DOMINANCE;

    if (
        isHorizontalSwipe &&
        direction !== 0 &&
        direction !== touchControls.lockedSwipeDirection
    ) {
        // Gauche : ramper. Droite : se relever.
        touchControls.isCrawling = direction < 0;
        touchControls.lockedSwipeDirection = direction;
        touchControls.postureAnchorX = x;
        touchControls.postureAnchorY = y;
    }

    touchControls.leftLastX = x;
    touchControls.leftLastY = y;
}

function releaseTouchPointer(pointerId, shouldFire = true) {
    if (pointerId === touchControls.leftPointerId) {
        touchControls.leftPointerId = null;
        touchControls.verticalSpeed = 0;
        touchControls.lockedSwipeDirection = 0;
    }

    if (pointerId === touchControls.rightPointerId) {
        touchControls.rightPointerId = null;
        endPlayerCharge('touch', shouldFire);
    }
}

function resetTouchControls() {
    touchControls.leftPointerId = null;
    touchControls.rightPointerId = null;
    touchControls.verticalSpeed = 0;
    touchControls.isCrawling = false;
    touchControls.lockedSwipeDirection = 0;
    chargeInputs.keyboard = false;
    chargeInputs.touch = false;
}

canvas.addEventListener('pointerdown', event => {
    if (event.pointerType === 'mouse') return;
    event.preventDefault();

    if (gameState === 'gameover') {
        resetGame();
        return;
    }

    const position = pointerPosition(event);
    if (position.isLeftHalf) {
        if (touchControls.leftPointerId !== null) return;

        touchControls.leftPointerId = event.pointerId;
        touchControls.leftStartY = position.y;
        touchControls.leftLastX = position.x;
        touchControls.leftLastY = position.y;
        touchControls.postureAnchorX = position.x;
        touchControls.postureAnchorY = position.y;
        touchControls.verticalSpeed = 0;
        touchControls.lockedSwipeDirection = 0;
    } else {
        if (touchControls.rightPointerId !== null) return;

        touchControls.rightPointerId = event.pointerId;
        if (gameState === 'waitingCharge') launchAssault();
        else if (gameState === 'playing') beginPlayerCharge('touch');
    }

    canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener('pointermove', event => {
    if (event.pointerId !== touchControls.leftPointerId) return;
    event.preventDefault();

    const position = pointerPosition(event);
    updateTouchVerticalSpeed(position.y);
    updateTouchPosture(position.x, position.y);
});

canvas.addEventListener('pointerup', event => {
    if (
        event.pointerId !== touchControls.leftPointerId &&
        event.pointerId !== touchControls.rightPointerId
    ) return;

    event.preventDefault();
    releaseTouchPointer(event.pointerId);
    if (canvas.hasPointerCapture(event.pointerId)) {
        canvas.releasePointerCapture(event.pointerId);
    }
});

canvas.addEventListener('pointercancel', event => releaseTouchPointer(event.pointerId, false));
canvas.addEventListener('lostpointercapture', event => releaseTouchPointer(event.pointerId, false));

document.getElementById('startMenu').addEventListener('pointerdown', event => {
    if (event.pointerType === 'mouse') return;
    event.preventDefault();
    startGame();
});

// Effets d'explosion pré-calculés. Pendant la partie, une explosion réaliste
// ne demande ainsi qu'un seul drawImage, comme un sprite animé classique.
const explosionBlastFrames = [];
const incomingShadowCanvas = document.createElement('canvas');

function createExplosionVisualCaches() {
    const frameCount = 7;
    const size = EXPLOSION_RADIUS * 2 + 32;
    const center = size * 0.5;

    incomingShadowCanvas.width = incomingShadowCanvas.height = 64;
    const shadowCtx = incomingShadowCanvas.getContext('2d');
    const shadowGradient = shadowCtx.createRadialGradient(32, 32, 3, 32, 32, 31);
    shadowGradient.addColorStop(0, 'rgba(16,12,10,0.9)');
    shadowGradient.addColorStop(0.62, 'rgba(31,25,21,0.68)');
    shadowGradient.addColorStop(0.88, 'rgba(42,35,30,0.28)');
    shadowGradient.addColorStop(1, 'rgba(42,35,30,0)');
    shadowCtx.fillStyle = shadowGradient;
    shadowCtx.fillRect(0, 0, 64, 64);

    for (let frameIndex = 0; frameIndex < frameCount; frameIndex++) {
        const progress = frameIndex / (frameCount - 1);
        const surface = document.createElement('canvas');
        surface.width = surface.height = size;
        const effectCtx = surface.getContext('2d');
        const radius = EXPLOSION_RADIUS * (0.58 + progress * 0.38);
        const fade = 1 - progress * 0.58;

        // Couronne de terre projetée, volontairement asymétrique.
        for (let i = 0; i < 9; i++) {
            const angle = i / 9 * Math.PI * 2 + 0.16;
            const variation = ((i * 37) % 7) / 7;
            const distance = radius * (0.44 + variation * 0.24);
            const dustRadius = radius * (0.18 + ((i * 19) % 5) * 0.035);
            const dustX = center + Math.cos(angle) * distance;
            const dustY = center + Math.sin(angle) * distance;
            const dust = effectCtx.createRadialGradient(dustX, dustY, 1, dustX, dustY, dustRadius);
            dust.addColorStop(0, `rgba(87,62,43,${fade * 0.7})`);
            dust.addColorStop(0.62, `rgba(65,49,39,${fade * 0.46})`);
            dust.addColorStop(1, 'rgba(48,39,34,0)');
            effectCtx.fillStyle = dust;
            effectCtx.beginPath();
            effectCtx.arc(dustX, dustY, dustRadius, 0, Math.PI * 2);
            effectCtx.fill();
        }

        effectCtx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 7; i++) {
            const angle = i / 7 * Math.PI * 2 + 0.28;
            const variation = ((i * 29) % 6) / 6;
            const distance = radius * (0.08 + progress * 0.2 + variation * 0.16);
            const lobeRadius = radius * (0.25 + ((i * 13) % 4) * 0.055);
            const lobeX = center + Math.cos(angle) * distance;
            const lobeY = center + Math.sin(angle) * distance;
            const flame = effectCtx.createRadialGradient(
                lobeX - lobeRadius * 0.18,
                lobeY - lobeRadius * 0.2,
                1,
                lobeX,
                lobeY,
                lobeRadius
            );
            flame.addColorStop(0, `rgba(255,244,174,${fade})`);
            flame.addColorStop(0.24, `rgba(255,190,48,${fade})`);
            flame.addColorStop(0.62, `rgba(222,83,18,${fade * 0.9})`);
            flame.addColorStop(1, 'rgba(92,42,25,0)');
            effectCtx.fillStyle = flame;
            effectCtx.beginPath();
            effectCtx.arc(lobeX, lobeY, lobeRadius, 0, Math.PI * 2);
            effectCtx.fill();
        }

        const coreRadius = radius * 0.74;
        const core = effectCtx.createRadialGradient(center - 6, center - 8, 2, center, center, coreRadius);
        core.addColorStop(0, `rgba(255,255,218,${fade})`);
        core.addColorStop(0.12, `rgba(255,213,73,${fade})`);
        core.addColorStop(0.5, `rgba(236,107,20,${fade * 0.95})`);
        core.addColorStop(0.78, `rgba(87,49,33,${fade * 0.7})`);
        core.addColorStop(1, 'rgba(48,36,30,0)');
        effectCtx.fillStyle = core;
        effectCtx.beginPath();
        effectCtx.arc(center, center, coreRadius, 0, Math.PI * 2);
        effectCtx.fill();

        if (progress > 0.34) {
            effectCtx.globalCompositeOperation = 'source-over';
            const smokeAlpha = (progress - 0.34) * 0.38;
            const smoke = effectCtx.createRadialGradient(center, center - 8, 4, center, center, radius * 0.9);
            smoke.addColorStop(0, `rgba(49,42,38,${smokeAlpha})`);
            smoke.addColorStop(0.55, `rgba(72,61,54,${smokeAlpha * 0.7})`);
            smoke.addColorStop(1, 'rgba(55,47,43,0)');
            effectCtx.fillStyle = smoke;
            effectCtx.fillRect(0, 0, size, size);
        }

        explosionBlastFrames.push(surface);
    }
}

/**
 * Returns the current horizontal world scrolling speed based on player state.
 * This speed applies to trenches, barbed wire, enemies, and non-crater explosions.
 */
function getCurrentWorldSpeed() {
    // If player is alive, check their state
    if (player && player.alive) {
        if (player.isCharging) {
            return WORLD_SPEED * SHOOT_SPEED_FACTOR;
        }
        if (player.isCrawling) {
            return WORLD_SPEED * CRAWL_SPEED_FACTOR;
        }
    }
    // Default speed if player is dead, not playing, or standing/not charging
    return WORLD_SPEED;
}

/**
 * Génère un pattern bruité terreux (couleurs légèrement aléatoires)
 *  size   : taille du tile (px)
 *  base   : couleur de base (hex p.ex. '#4e3d31')
 *  varPct : amplitude de variation (0‑100, % de différence)
 */

function spawnTrench(x) {
  const h = canvas.height;
  const trench = trenchPool.length > 0 ? trenchPool.pop() : {
    x: 0,
    counted: false,
    leftPts: [],
    rightPts: [],
    floorDebris: [],
    cracks: [],
    planks: []
  };

  trench.visualVariant = randomRange(0, TRENCH_VISUAL_VARIANTS.length - 1);
  const visualVariant = TRENCH_VISUAL_VARIANTS[trench.visualVariant];

  /* 1) contours gauche et droit ------------------------ */
  const leftPts = trench.leftPts;
  const rightPts = trench.rightPts || (trench.rightPts = []);
  let leftPointCount = 0;
  let y = 0;
  while (true) {
    const point = leftPts[leftPointCount] || (leftPts[leftPointCount] = {});
    const rightPoint = rightPts[leftPointCount] || (rightPts[leftPointCount] = {});
    point.y = y;
    point.dx = (Math.random() - .5) * 10;
    rightPoint.y = y;
    rightPoint.dx = (Math.random() - .5) * 10;
    leftPointCount++;
    if (y === h) break;
    y = Math.min(h, y + randomRange(38, 56));
  }
  leftPts.length = leftPointCount;
  rightPts.length = leftPointCount;

  /* 2) débris du sol ---------------------------------- */
  const floorDebris = trench.floorDebris;
  for (let i = 0; i < 50; i++) {
    const debris = floorDebris[i] || (floorDebris[i] = {});
    debris.dx = randomRange(TRENCH_WIDTH*.45, TRENCH_WIDTH*.55);
    debris.y = randomRange(0, h);
    debris.w = randomRange(1,3);
    debris.h = randomRange(5,15);
  }
  floorDebris.length = 50;

  /* 3) fissures droite -------------------------------- */
  const cracks = trench.cracks;
  for (let i = 0; i < 5; i++) {
    cracks[i] = TRENCH_WIDTH*.6 + randomRange(0, TRENCH_WIDTH*.4);
  }
  cracks.length = 5;

  /* 4) planches --------------------------------------- */
  const planks = trench.planks;
  const plankCount = randomRange(visualVariant.plankMin, visualVariant.plankMax);
  for (let i = 0; i < plankCount; i++) {
    const y  = (i+1)*(h/(plankCount+1)) + randomRange(-5,5);
    const ht = 8 + randomRange(-2,2);

    const plank = planks[i] || (planks[i] = { knots: [], nails: [] });
    plank.y = y;
    plank.h = ht;
    plank.leftInset = randomRange(0, 4);
    plank.rightInset = randomRange(0, 4);

    const knots = plank.knots;
    for (let k=0;k<3;k++) {
      const knot = knots[k] || (knots[k] = {});
      knot.dx = randomRange(0, TRENCH_WIDTH);
      knot.dy = randomRange(0, ht);
    }
    knots.length = 3;

    const nails = plank.nails;
    for (let n=0;n<2;n++) {
      const nail = nails[n] || (nails[n] = {});
      nail.dx = randomRange(0, TRENCH_WIDTH);
      nail.dy = ht/2;
    }
    nails.length = 2;

  }
  planks.length = plankCount;

  trench.x = x;
  trench.counted = false;
  trenches.push(trench);
}



function traceCraterPath(targetCtx, crater, centerX, centerY, scale) {
    const points = crater.pts;
    const firstX = centerX + (points[0].x - crater.x) * scale;
    const firstY = centerY + (points[0].y - crater.y) * scale;
    const secondX = centerX + (points[1].x - crater.x) * scale;
    const secondY = centerY + (points[1].y - crater.y) * scale;

    targetCtx.beginPath();
    targetCtx.moveTo((firstX + secondX) * 0.5, (firstY + secondY) * 0.5);
    for (let i = 1; i <= points.length; i++) {
        const current = points[i % points.length];
        const next = points[(i + 1) % points.length];
        const currentX = centerX + (current.x - crater.x) * scale;
        const currentY = centerY + (current.y - crater.y) * scale;
        const nextX = centerX + (next.x - crater.x) * scale;
        const nextY = centerY + (next.y - crater.y) * scale;
        targetCtx.quadraticCurveTo(
            currentX,
            currentY,
            (currentX + nextX) * 0.5,
            (currentY + nextY) * 0.5
        );
    }
    targetCtx.closePath();
}

// Version de secours visible seulement pendant les quelques images précédant
// la création du cache. Le rendu complet ci-dessous est ensuite réutilisé.
function drawCraterVector(targetCtx, crater) {
    traceCraterPath(targetCtx, crater, crater.x, crater.y, 1);
    targetCtx.fillStyle = '#2b211a';
    targetCtx.fill();

    traceCraterPath(targetCtx, crater, crater.x, crater.y - 1, 0.88);
    targetCtx.fillStyle = '#5b4433';
    targetCtx.fill();

    traceCraterPath(targetCtx, crater, crater.x, crater.y + 2, 0.68);
    targetCtx.fillStyle = '#18130f';
    targetCtx.fill();
}

function cacheCraterDrawing(crater) {
    const visualRadius = Math.ceil(crater.radius * CRATER_VISUAL_RADIUS_FACTOR + 2);
    const displaySize = visualRadius * 2;
    const size = Math.ceil(displaySize / CRATER_PIXEL_SCALE);
    const surface = crater.renderCache || document.createElement('canvas');
    surface.width = size;
    surface.height = size;

    const cacheCtx = surface.getContext('2d');
    cacheCtx.imageSmoothingEnabled = false;
    const center = size * 0.5;
    const radius = crater.radius / CRATER_PIXEL_SCALE;
    const pathScale = 1 / CRATER_PIXEL_SCALE;

    // Quatre aplats seulement : le cache minuscule sera agrandi sans lissage.
    traceCraterPath(cacheCtx, crater, center, center + 1, pathScale);
    cacheCtx.fillStyle = '#2a2019';
    cacheCtx.fill();

    traceCraterPath(cacheCtx, crater, center, center - 0.5, pathScale * 0.9);
    cacheCtx.fillStyle = '#614936';
    cacheCtx.fill();

    traceCraterPath(cacheCtx, crater, center, center + 0.8, pathScale * 0.7);
    cacheCtx.fillStyle = '#2b211a';
    cacheCtx.fill();

    traceCraterPath(cacheCtx, crater, center, center + 1.2, pathScale * 0.48);
    cacheCtx.fillStyle = '#17120f';
    cacheCtx.fill();

    // Quelques pixels clairs suggèrent la terre retournée côté lumière.
    cacheCtx.fillStyle = '#7a5c42';
    cacheCtx.fillRect(Math.round(center - radius * 0.65), Math.round(center - radius * 0.67), 2, 1);
    if (radius > 8) {
        cacheCtx.fillRect(Math.round(center + radius * 0.28), Math.round(center - radius * 0.72), 1, 1);
    }

    crater.renderCache = surface;
    crater.renderCacheOffset = visualRadius;
    crater.renderCacheDisplaySize = displaySize;
    crater.renderCacheReady = true;
}

function queueCraterCache(crater) {
    crater.renderCacheReady = false;
    pendingCraterCaches.push(crater);
}

function processCraterCacheQueue(maxPerFrame = 4) {
    let processed = 0;
    while (pendingCraterCacheIndex < pendingCraterCaches.length && processed < maxPerFrame) {
        const crater = pendingCraterCaches[pendingCraterCacheIndex++];
        cacheCraterDrawing(crater);
        processed++;
    }

    if (pendingCraterCacheIndex >= pendingCraterCaches.length) {
        pendingCraterCaches.length = 0;
        pendingCraterCacheIndex = 0;
    }
}

function makeCrater(x, y, radius) {
    const rough  = 0.2;       // irrégularité douce, lissée lors du dessin
    const N      = 32;        // nombre de sommets
    const crater = decorativeCraterPool.length > 0
        ? decorativeCraterPool.pop()
        : { x: 0, y: 0, radius: 0, pts: [] };
    const pts = crater.pts;
    for (let i = 0; i < N; i++) {
        const a   = (i / N) * Math.PI * 2;
        const off = radius * (1 + (Math.random() - .5) * rough);
        const point = pts[i] || (pts[i] = {});
        point.x = x + Math.cos(a) * off;
        point.y = y + Math.sin(a) * off;
    }
    pts.length = N;
    crater.x = x;
    crater.y = y;
    crater.radius = radius;
    queueCraterCache(crater);
    return crater;
}

function chooseDecorationSprite() {
    let roll = Math.random() * DECORATION_TOTAL_WEIGHT;
    for (let i = 0; i < DECORATION_SPRITES.length; i++) {
        roll -= DECORATION_SPRITES[i].weight;
        if (roll <= 0) return DECORATION_SPRITES[i];
    }
    return DECORATION_SPRITES[DECORATION_SPRITES.length - 1];
}

function decorationBaseOverlapsObstacle(x, y, width, height, useBarbedIndex = false) {
    // Petite empreinte au sol située au bas du sprite. La partie haute est
    // volontairement ignorée pour autoriser les chevauchements en perspective.
    const baseX = x;
    const baseY = y + height * 0.42;
    const baseRadius = Math.max(4, Math.min(12, width * 0.18));

    for (const crater of decorativeCraters) {
        const minimumDistance = crater.radius * CRATER_VISUAL_RADIUS_FACTOR + baseRadius;
        if (getDistance(baseX, baseY, crater.x, crater.y) < minimumDistance) return true;
    }

    for (const trench of trenches) {
        const variant = TRENCH_VISUAL_VARIANTS[trench.visualVariant];
        const trenchLeft = trench.x - (variant.width - TRENCH_WIDTH) * 0.5;
        if (baseX + baseRadius > trenchLeft &&
            baseX - baseRadius < trenchLeft + variant.width) return true;
    }

    const baseLeft = baseX - baseRadius;
    const baseTop = baseY - baseRadius;
    const baseRight = baseX + baseRadius;
    const baseBottom = baseY + baseRadius;
    if (useBarbedIndex) {
        return hasOverlappingBarbedWire(baseLeft, baseTop, baseRight, baseBottom);
    }

    for (const barbed of barbedWires) {
        if (barbed.alive && barbed.x < baseRight && barbed.right > baseLeft &&
            barbed.y < baseBottom && barbed.bottom > baseTop) return true;
    }
    return false;
}

function findDecorationPlacement(x, requestedY, width, height) {
    const halfHeight = height * 0.5;
    const minY = Math.min(canvas.height * 0.5, halfHeight + 8);
    const maxY = Math.max(minY, canvas.height - halfHeight - 8);
    const minX = Math.max(30, x - 120);
    const maxX = Math.min(canvas.width + 180, x + 120);
    let candidateX = x;
    let candidateY = Math.max(minY, Math.min(maxY, requestedY));

    for (let attempt = 0; attempt < 18; attempt++) {
        if (!decorationBaseOverlapsObstacle(candidateX, candidateY, width, height)) {
            return { x: candidateX, y: candidateY };
        }
        candidateX = minX + Math.random() * Math.max(0, maxX - minX);
        candidateY = minY + Math.random() * (maxY - minY);
    }
    return null;
}

function findStaticCraterPlacementY(x, requestedY, radius) {
    let candidateY = requestedY;
    for (let attempt = 0; attempt < 14; attempt++) {
        let overlapsDecoration = false;
        for (const decoration of battlefieldDecorations) {
            const baseX = decoration.x;
            const baseY = decoration.y + decoration.height * 0.42;
            const baseRadius = Math.max(4, Math.min(12, decoration.width * 0.18));
            const minimumDistance = radius * CRATER_VISUAL_RADIUS_FACTOR + baseRadius;
            if (getDistance(x, candidateY, baseX, baseY) < minimumDistance) {
                overlapsDecoration = true;
                break;
            }
        }
        if (!overlapsDecoration) return candidateY;
        candidateY = randomRange(0, canvas.height);
    }
    return null;
}

function spawnBattlefieldDecoration(x, y) {
    if (battlefieldDecorations.length >= DECORATION_MAX_VISIBLE) return;

    const sprite = chooseDecorationSprite();
    const scale = sprite.minScale + Math.random() * (sprite.maxScale - sprite.minScale);
    const width = Math.round(sprite.sw * scale);
    const height = Math.round(sprite.sh * scale);
    const placement = findDecorationPlacement(x, y, width, height);
    if (placement === null) return;
    x = placement.x;
    y = placement.y;
    const decoration = battlefieldDecorationPool.length > 0
        ? battlefieldDecorationPool.pop()
        : {};

    decoration.x = x;
    decoration.y = y;
    decoration.sprite = sprite;
    decoration.width = width;
    decoration.height = height;
    decoration.rotation = (Math.random() - 0.5) * 0.28;
    decoration.flipX = Math.random() < 0.5;
    // Le bas visuel sert de point Z, comme les pieds d'un soldat.
    decoration.bottom = y + decoration.height * 0.5;
    decoration.draw = drawBattlefieldDecorationEntity;
    battlefieldDecorations.push(decoration);
}

function drawBattlefieldDecoration(targetCtx, decoration) {
    if (!decorationImageLoaded) return;

    const sprite = decoration.sprite;
    targetCtx.save();
    targetCtx.translate(decoration.x, decoration.y);
    targetCtx.rotate(decoration.rotation);
    targetCtx.scale(decoration.flipX ? -1 : 1, 1);
    targetCtx.imageSmoothingEnabled = false;
    targetCtx.drawImage(
        decorationImage,
        sprite.sx,
        sprite.sy,
        sprite.sw,
        sprite.sh,
        -decoration.width * 0.5,
        -decoration.height * 0.5,
        decoration.width,
        decoration.height
    );
    targetCtx.restore();
}

function drawBattlefieldDecorationEntity() {
    drawBattlefieldDecoration(ctx, this);
}


/**
 * Calculates the distance between two points.
 */
function getDistance(x1, y1, x2, y2) {
    const dx = x1 - x2;
    const dy = y1 - y2;
    return Math.sqrt(dx * dx + dy * dy);
}


// --- Sound Manager ---
const soundManager = {
    // Single sounds
    bgMusic: document.getElementById('bgMusic'),
    startWhistle: document.getElementById('startWhistle'),
    trenchCapture: document.getElementById('trenchCapture'),

    // Pooled sounds (NodeLists from HTML)
    explosionPool: document.querySelectorAll('.explosionSound'),
    shotPool: document.querySelectorAll('.shotSound'),
    deathPool: document.querySelectorAll('.deathSound'),
    whizPool: document.querySelectorAll('.whizSound'),
    incomingPool: document.querySelectorAll('.incomingSound'),

    // Max audible distance for volume calculation (adjust based on your game scale)
    maxAudibleDistance: 1000, // Sounds beyond this distance will be silent

    init: function() {
        // Set initial volume for background music (optional)
        if (this.bgMusic) this.bgMusic.volume = 1; // Lower volume
    },

    // Get an available audio element from a pool (one that is paused or ended)
    getAvailableSound: function(pool) {
        for (let i = 0; i < pool.length; i++) {
            if (pool[i].paused || pool[i].ended) {
                return pool[i];
            }
        }
        // Fallback: return null if no available element
        // console.warn(`Sound pool exhausted!`); // Uncomment for debugging pool size
        return null;
    },

    // Play a sound with optional positional volume
    playSound: function(soundName, x = null, y = null) {
        let element = null;
        let pool = null;

        // Determine if it's a pooled sound or single sound
        if (soundName === 'explosion') { pool = this.explosionPool; element = this.getAvailableSound(pool); }
        else if (soundName === 'shot') { pool = this.shotPool; element = this.getAvailableSound(pool); }
        else if (soundName === 'death') { pool = this.deathPool; element = this.getAvailableSound(pool); }
        else if (soundName === 'whiz') { pool = this.whizPool; element = this.getAvailableSound(pool); }
        else if (soundName === 'incoming') { pool = this.incomingPool; element = this.getAvailableSound(pool); }
        else { // Single sounds
            element = this[soundName];
        }

        if (element) {
            // Stop and reset if already playing (important for rapid sounds)
            element.pause();
            element.currentTime = 0;

            // Adjust volume based on distance if coordinates are provided and player is alive
            if (x !== null && y !== null && player && player.alive) {
                const distance = getDistance(player.centerX, player.centerY, x, y);
                // Volume decreases linearly with distance, clamped between 0 and 1
                let volume = 1 - distance / this.maxAudibleDistance;
                volume = Math.max(0, Math.min(1, volume)); // Clamp between 0 and 1
                element.volume = volume;
            } else {
                // Default volume for non-positional sounds or if player is dead
                element.volume = 1.0; // Or a specific default
                if (soundName === 'bgMusic') element.volume = 0.4; // Keep background music lower
            }

            // Play the sound
            element.play().catch(e => {
                // Handle potential autoplay errors (e.g., user hasn't interacted yet)
                // console.warn(`Autoplay prevented for ${soundName}:`, e); // Uncomment for debugging
            });
        }
    },

    // Stop background music
    stopBgMusic: function() {
        if (this.bgMusic) {
            this.bgMusic.pause();
            this.bgMusic.currentTime = 0;
        }
    }
};

class Entity {
    constructor(x, y, w, h) {
        this.x = x;
        this.y = y;
        this.w = w;
        this.h = h;
        this.alive = true;
    }
    get right() { return this.x + this.w; }
    get bottom() { return this.y + this.h; }
    get centerX() { return this.x + this.w / 2; }
    get centerY() { return this.y + this.h / 2; }
    intersects(o) {
        return this.x < o.right && this.right > o.x && this.y < o.bottom && this.bottom > o.y;
    }
    // Placeholder methods
    update(dt) {}
    // Base draw method - can be overridden by subclasses
    draw() {
        // Default drawing (e.g., hitbox for debugging)
        if (DEBUG_DRAW_HITBOXES) {
             ctx.fillStyle = 'rgba(255, 255, 255, 0.5)'; // Semi-transparent white for generic entities
             ctx.fillRect(this.x, this.y, this.w, this.h);
        }
    }
}

class Player extends Entity {
    constructor() {
        super(PLAYER_X, canvas.height / 2 - PLAYER_HEIGHT_STANDING / 2, PLAYER_WIDTH, PLAYER_HEIGHT_STANDING);
        this.vy = 0;
        this.isCrawling = false;
        this.isCharging = false;
        this.isWaiting = false;
        this.chargeTime = 0;
        this.shootCooldown = 0; // Cooldown for regular shot ('F' key)

        this.runFrames       = [
            spriteMap.player_running1,
            spriteMap.player_running2
            ];
        this.currentRunFrame = 0;      // index de la frame actuelle
        this.runTimer        = 0;      // compteur en ms
        this.runFrameDuration= 300;    // durée de chaque frame (ajuste à 100–200 ms)
    }

    update(dt) {
        const dtSec = dt / 1000;

        // Decrement cooldowns
        if (this.shootCooldown > 0) this.shootCooldown -= dt;

        // Handle charging state
        if (this.isCharging) {
             this.chargeTime += dt;
             // Cap charge time at max duration
             if (this.chargeTime > PLAYER_CHARGE_DURATION) {
                 this.chargeTime = PLAYER_CHARGE_DURATION;
             }
        }

        // Le déplacement vertical et la posture ne dépendent pas du tir : ils
        // restent actifs en charge, en rampant, ou dans les deux états à la fois.
        let keyboardVerticalSpeed = 0;
        if (keys['ArrowUp'] || keys['KeyW']) keyboardVerticalSpeed -= PLAYER_SPEED_Y;
        if (keys['ArrowDown'] || keys['KeyS']) keyboardVerticalSpeed += PLAYER_SPEED_Y;

        const verticalSpeedLimit = touchControls.leftPointerId !== null
            ? TOUCH_MAX_SPEED_Y
            : PLAYER_SPEED_Y;
        this.vy = Math.max(
            -verticalSpeedLimit,
            Math.min(verticalSpeedLimit, keyboardVerticalSpeed + touchControls.verticalSpeed)
        );
        this.isCrawling = !!(keys['ArrowLeft'] || keys['KeyA']) || touchControls.isCrawling;

        // Apply vertical movement
        this.y += this.vy * dtSec;

        // Keep player within canvas bounds vertically
        const currentHeight = this.isCrawling ? PLAYER_HEIGHT_CRAWLING : PLAYER_HEIGHT_STANDING;
        if (this.y < 0) this.y = 0;
        if (this.y + currentHeight > canvas.height) this.y = canvas.height - currentHeight;

        // Ajuste largeur & hauteur en fonction de l’état crawling
        if (this.isCrawling) {
            this.w = PLAYER_WIDTH_CRAWLING;
            this.h = PLAYER_HEIGHT_CRAWLING;
            // Recentre horizontalement la hitbox plus large
            this.x = PLAYER_X - (PLAYER_WIDTH_CRAWLING - PLAYER_WIDTH) / 2;
        } else {
            this.w = PLAYER_WIDTH;
            this.h = PLAYER_HEIGHT_STANDING;
            this.x = PLAYER_X;
        }


        if (!this.isCrawling) {
            this.runTimer += dt;
            if (this.runTimer >= this.runFrameDuration) {
            this.runTimer -= this.runFrameDuration
            this.currentRunFrame = (this.currentRunFrame + 1) % this.runFrames.length;
            }
        } else {
            // on réinitialise l’anim quand on passe en crawl
            this.currentRunFrame = 0;
            this.runTimer        = 0;
        }
    }

    shootRegular() {
        // Fires a non-piercing bullet
        spawnBullet(this.x + this.w, this.centerY, BULLET_SPEED, 'ally', false);
    }

    draw() {
        // Draw hitbox for debugging
        if (DEBUG_DRAW_HITBOXES) {
            ctx.fillStyle = 'rgba(0, 0, 255, 0.5)'; // Semi-transparent blue for player hitbox
            ctx.fillRect(this.x, this.y, this.w, this.h);
        }

        // Draw sprite if loaded
        if (this.isWaiting) {
            // Pose “chargement” sans barre ni logique
            const sprite = spriteMap.player_firing;
            ctx.drawImage(
            spriteSheetImage,
            sprite.sx, sprite.sy, sprite.sw, sprite.sh,
            this.x, this.y, this.w, this.h
            );
            return;  // on sort, pas d’autre dessin
        }

        if (spritesLoaded) {
            let sprite;
            if (this.isCrawling) {
                // en crawl, QUE le sprite de crawl, même si on charge
                sprite = spriteMap.player_crawling;
            } else if (this.isCharging) {
                // debout et en charge : sprite firing
                sprite = spriteMap.player_firing;
            } else {
                // course : alternance running1/running2
                sprite = this.runFrames[this.currentRunFrame];
            }

            ctx.drawImage(
                spriteSheetImage,
                sprite.sx, sprite.sy, sprite.sw, sprite.sh,
                this.x, this.y,
                this.w, this.h
            );
        } else if (!DEBUG_DRAW_HITBOXES) {
             // Fallback if sprites not loaded and not debugging hitboxes
             ctx.fillStyle = 'blue'; // Solid blue fallback if no sprites and no debug
             ctx.fillRect(this.x, this.y, this.w, this.h);
        }


        // Visual indicator for charged shot (drawn on top of sprite)
        /*if (this.isCharging) {

             // Draw charge bar

class Ally extends Soldier {
    constructor(x, y) {
        const vitesseallié = 1 + randomRange(-ALLY_SPEED_VARIATION * 100, ALLY_SPEED_VARIATION * 100) / 100;

        super(x, y, 'green'); // Pass color for debug/fallback
        this.shootCooldown = randomRange(10000, 20000);
        this.randomVy = 0; // Current random vertical speed
        this.nextRandomMoveTime = 0; // When to pick new randomVy
        // Base speed relative to the world, with variation
        this.baseSpeedFactor = vitesseallié;
        this.crawlTimer = 0; // Timer for random crawling
        this.stayCrawlingTimer = 0; // Timer for barbed wire crawling

        this.runFrames       = [
            spriteMap.ally_running1,
            spriteMap.ally_running2
            ];
        this.currentRunFrame = randomRange(0,1);      // index de la frame actuelle
        this.runTimer        = 0;      // compteur en ms
        this.runFrameDuration= 300 * vitesseallié;    // durée de chaque frame (ajuste à 100–200 ms)
    }

    init(x, y) {
        const speedVariation = 1 + randomRange(
            -ALLY_SPEED_VARIATION * 100,
            ALLY_SPEED_VARIATION * 100
        ) / 100;

        this.x = x;
        this.y = y;
        this.w = PLAYER_WIDTH;
        this.h = PLAYER_HEIGHT_STANDING;
        this.alive = true;
        this.color = 'green';
        this.vy = 0;
        this.isCrawling = false;
        this.isCharging = false;
        this.isWaiting = false;
        this.chargeTime = 0;
        this.timeSinceLastRandomMove = 0;
        this.shootCooldown = randomRange(10000, 20000);
        this.randomVy = 0;
        this.nextRandomMoveTime = 0;
        this.baseSpeedFactor = speedVariation;
        this.crawlTimer = 0;
        this.stayCrawlingTimer = 0;
        this.runFrames = ALLY_RUN_FRAMES;
        this.currentRunFrame = randomRange(0, 1);
        this.runTimer = 0;
        this.runFrameDuration = 300 * speedVariation;
        return this;
    }

    update(dt, currentWorldSpeed = getCurrentWorldSpeed()) {
        /* NE RIEN FAIRE tant que l’allié attend le coup de sifflet */

        /* Tant qu’on attend le coup de sifflet
        → on suit simplement le scroll du monde                      */
        if (this.isWaiting) {
            this.x -= currentWorldSpeed * dt / 1000;  // même déplacement que le décor
            return;                                        // rien d’autre
        }
        
        const dtSec = dt / 1000;



        // --- Horizontal Movement ---
        // Ally's base speed relative to the world (with variation)
        const allyWorldBaseSpeed = WORLD_SPEED * this.baseSpeedFactor;
        // Ally's effective speed factor relative to the world (reduced if crawling OR charging)
        const allyEffectiveFactor = (this.isCrawling || this.isCharging) ? CRAWL_SPEED_FACTOR : 1;
        // Ally's effective speed relative to the world
        const allyWorldEffectiveSpeed = allyWorldBaseSpeed * allyEffectiveFactor;
        // Ally's speed relative to the screen
        const effectiveMoveX = allyWorldEffectiveSpeed - currentWorldSpeed;
        this.x += effectiveMoveX * dtSec;


        // --- Crawling Logic (Barbed Wire & Crater) ---
        // Barbed wire detection
        const barbedDetected = hasOverlappingBarbedWire(
            this.x - ALLY_BARBED_WIRE_DETECTION_DIST,
            this.y,
            this.x + ALLY_BARBED_WIRE_DETECTION_DIST,
            this.bottom
        );

        if (barbedDetected) {
            this.stayCrawlingTimer = 800; // stay down for 800ms after detection
        }

        // Crater detection and random crawl initiation
        let nearCrater = false;
        for (const ex of explosions) {
            if (ex.alive && ex.phase === 'crater') {
                const dCrater = Math.hypot(ex.x - this.centerX, ex.y - this.centerY);
                if (dCrater < EXPLOSION_RADIUS + ALLY_CRATER_DETECTION_RADIUS) { // Check distance to crater center + radius
                    nearCrater = true;
                    break; // Found one, no need to check others
                }
            }
        }

        // Animation de course si l’allié ne crawl pas et ne charge pas
        if (!this.isCrawling && !this.isCharging) {
        this.runTimer += dt;
        if (this.runTimer >= this.runFrameDuration) {
            this.runTimer    -= this.runFrameDuration;
            this.currentRunFrame = (this.currentRunFrame + 1) % this.runFrames.length;
        }
        } else {
        // reset quand on passe en crawl ou charge
        this.currentRunFrame = 0;
        this.runTimer        = 0;
        }

        if (nearCrater && this.crawlTimer <= 0 && this.stayCrawlingTimer <= 0 && !this.isCharging) { // Don't start random crawl if charging
            // Random chance to start crawling when near a crater and not already crawling/forced down/charging
            if (Math.random() < ALLY_CRAWL_CHANCE_IN_CRATER) {
                this.crawlTimer = ALLY_RANDOM_CRAWL_DURATION;
            }
        }

        // Decrement timers
        if (this.stayCrawlingTimer > 0) this.stayCrawlingTimer -= dt;
        if (this.crawlTimer > 0) this.crawlTimer -= dt;

        // Determine crawling state: forced by wire, random
        this.isCrawling = this.stayCrawlingTimer > 0 || this.crawlTimer > 0;

        /// Ajuste largeur & hauteur en fonction de l’état crawling
        const oldWidth = this.w;
        const newWidth = this.isCrawling ? PLAYER_WIDTH_CRAWLING : PLAYER_WIDTH;
        this.w = newWidth;
        this.h = this.isCrawling ? PLAYER_HEIGHT_CRAWLING : PLAYER_HEIGHT_STANDING;
        // Décale pour garder l’allié centré horizontalement
        this.x -= (newWidth - oldWidth) / 2;

        // --- Shooting Logic (Seulement tirs chargés) ---
        if (this.isCharging) {
            // Si déjà en charge, on incrémente le timer
            this.chargeTime += dt;
            if (this.chargeTime >= ALLY_CHARGE_DURATION) {
                // Dès que la charge est complète, on tire un tir piercing
                spawnBullet(this.x + this.w, this.centerY, BULLET_SPEED, 'ally', false);
                // On réinitialise l’état de charge
                this.isCharging = false;
                this.chargeTime  = 0;
                // On applique un cooldown prolongé avant la prochaine charge
                this.shootCooldown = randomRange(
                ALLY_SHOOT_COOLDOWN_MIN,
                ALLY_SHOOT_COOLDOWN_MAX
                );
            }
        } else {
            // Pas en charge : on décrémente le cooldown
            this.shootCooldown -= dt;
            if (this.shootCooldown <= 0) {
                // Quand le cooldown est à zéro, on repart en charge directement
                this.isCharging = true;
                this.chargeTime  = 0;
                // Le cooldown sera remis après le tir chargé
            }
        }

        // --- Vertical Movement ---
        // Apply random vertical movement only when standing AND not charging
        if (!this.isCrawling && !this.isCharging) {
             this.timeSinceLastRandomMove += dt;
             if (this.timeSinceLastRandomMove >= this.nextRandomMoveTime) {
                 this.randomVy = randomRange(-ALLY_VERTICAL_SPEED, ALLY_VERTICAL_SPEED);
                 this.nextRandomMoveTime = randomRange(ALLY_RANDOM_MOVE_INTERVAL * 0.8, ALLY_RANDOM_MOVE_INTERVAL * 1.2);
                 this.timeSinceLastRandomMove = 0;
             }
             this.y += this.randomVy * dtSec;
        } else {
            // Stop random vertical movement while crawling or charging
            this.randomVy = 0;
        }

        // Keep allies within canvas bounds vertically (adjusting for current height)
        const currentHeight = this.isCrawling ? PLAYER_HEIGHT_CRAWLING : PLAYER_HEIGHT_STANDING;
        if (this.y < 0) { this.y = 0; this.randomVy = Math.abs(this.randomVy); } // Bounce off top
        if (this.y + currentHeight > canvas.height) {
            this.y = canvas.height - currentHeight;
            this.randomVy = -Math.abs(this.randomVy); // Bounce off bottom
        }
    }

    draw() {
        // debug hitbox
        if (DEBUG_DRAW_HITBOXES) {
            ctx.fillStyle = 'rgba(0,255,0,0.5)';
            ctx.fillRect(this.x,this.y,this.w,this.h);
        }

        if (this.isWaiting) {
            const sprite = spriteMap.ally_firing || spriteMap.player_firing;
            ctx.drawImage(
            spriteSheetImage,
            sprite.sx, sprite.sy, sprite.sw, sprite.sh,
            this.x, this.y, this.w, this.h
            );
            return;
        }

        if (spritesLoaded) {
            let sprite;
            if (this.isCrawling) {
                // Priorité au sprite de crawl, même si on charge
                sprite = spriteMap.ally_crawling;
            }
            else if (this.isCharging) {
                // Debout et en charge : sprite ally_firing (si défini)
                sprite = spriteMap.ally_firing;
            }
            else {
                // Course : alternance running1/running2
                sprite = this.runFrames[this.currentRunFrame];
            }

            ctx.drawImage(
                spriteSheetImage,
                sprite.sx, sprite.sy, sprite.sw, sprite.sh,
                this.x, this.y, this.w, this.h
            );
        } else if (!DEBUG_DRAW_HITBOXES) {
            // fallback
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x,this.y,this.w,this.h);
        }

    }
}

class Enemy extends Soldier {
    constructor(x, y) {
        super(x, y, 'red'); // Pass color for debug/fallback
        this.shootCooldown = randomRange(ENEMY_SHOOT_COOLDOWN_MIN, ENEMY_SHOOT_COOLDOWN_MAX);
        // Enemies do not crawl or charge (based on original code)
        this.isCrawling = false;
        this.isCharging = false;
    }

    init(x, y) {
        this.x = x;
        this.y = y;
        this.w = PLAYER_WIDTH;
        this.h = PLAYER_HEIGHT_STANDING;
        this.alive = true;
        this.color = 'red';
        this.vy = 0;
        this.isCrawling = false;
        this.isCharging = false;
        this.isWaiting = false;
        this.chargeTime = 0;
        this.timeSinceLastRandomMove = 0;
        this.shootCooldown = randomRange(ENEMY_SHOOT_COOLDOWN_MIN, ENEMY_SHOOT_COOLDOWN_MAX);
        return this;
    }

    update(dt, currentWorldSpeed = getCurrentWorldSpeed()) {
        const dtSec = dt / 1000;
        // Enemies move left relative to the screen at the current world speed
        this.x -= currentWorldSpeed * dtSec;

        // Gestion du tir
        this.shootCooldown -= dt;
        if (this.shootCooldown <= 0) {
            // Find nearest target (player or ally) within vertical alignment threshold
            let target = null;
            let minDistSq = Infinity;

            // Check player
            if (player.alive && Math.abs(player.centerY - this.centerY) < ENEMY_SHOOT_ALIGNMENT_THRESHOLD) {
                 const dx = player.centerX - this.centerX;
                 const dy = player.centerY - this.centerY;
                 minDistSq = dx*dx + dy*dy;
                 target = player;
            }

            // Check allies
            for (const ally of allies) {
                if (ally.alive && Math.abs(ally.centerY - this.centerY) < ENEMY_SHOOT_ALIGNMENT_THRESHOLD) {
                    const dx = ally.centerX - this.centerX;
                    const dy = ally.centerY - this.centerY;
                    const distSq = dx*dx + dy*dy;
                    if (distSq < minDistSq) {
                        minDistSq = distSq;
                        target = ally;
                    }
                }
            }


            if (target) {
                // Simple straight shot towards target's Y, from enemy's X
                spawnBullet(this.x, this.centerY, -BULLET_SPEED, 'enemy');
            } else {
                 // If no target, maybe don't shoot? Or shoot straight? Let's not shoot if no target.
            }
            this.shootCooldown = randomRange(ENEMY_SHOOT_COOLDOWN_MIN, ENEMY_SHOOT_COOLDOWN_MAX);
        }
    }

    draw() {
        // Call base draw for hitbox (if enabled)
        super.draw();

        // Draw sprite if loaded
        if (spritesLoaded) {
            const spriteKey = 'enemy_standing'; // Enemies only have standing sprite
            const sprite = spriteMap[spriteKey];
            if (sprite) {
                 // Draw the sprite scaled to the entity's current size (this.w, this.h)
                 ctx.drawImage(spriteSheetImage,
                               sprite.sx, sprite.sy, sprite.sw, sprite.sh,
                               this.x, this.y, this.w, this.h);
            } else {
                 console.warn(`Sprite key "${spriteKey}" not found in spriteMap.`);
            }
        } else if (!DEBUG_DRAW_HITBOXES) {
             // Fallback if sprites not loaded and not debugging hitboxes
             ctx.fillStyle = this.color; // Solid color fallback
             ctx.fillRect(this.x, this.y, this.w, this.h);
        }
    }
}

function getBarbedSpatialKey(cellX, cellY) {
    return (cellY + BARBED_SPATIAL_KEY_OFFSET) * 65536 +
           (cellX + BARBED_SPATIAL_KEY_OFFSET);
}

function clearBarbedSpatialIndex() {
    for (const bucket of usedBarbedSpatialBuckets) bucket.length = 0;
    usedBarbedSpatialBuckets.length = 0;
}

function rebuildBarbedSpatialIndex() {
    clearBarbedSpatialIndex();

    for (const barbed of barbedWires) {
        if (!barbed.alive) continue;

        const minCellX = Math.floor(barbed.x / BARBED_SPATIAL_CELL_SIZE);
        const maxCellX = Math.floor(barbed.right / BARBED_SPATIAL_CELL_SIZE);
        const minCellY = Math.floor(barbed.y / BARBED_SPATIAL_CELL_SIZE);
        const maxCellY = Math.floor(barbed.bottom / BARBED_SPATIAL_CELL_SIZE);

        for (let cellY = minCellY; cellY <= maxCellY; cellY++) {
            for (let cellX = minCellX; cellX <= maxCellX; cellX++) {
                const key = getBarbedSpatialKey(cellX, cellY);
                let bucket = barbedSpatialBuckets.get(key);
                if (!bucket) {
                    bucket = [];
                    barbedSpatialBuckets.set(key, bucket);
                }
                if (bucket.length === 0) usedBarbedSpatialBuckets.push(bucket);
                bucket.push(barbed);
            }
        }
    }
}

function hasOverlappingBarbedWire(left, top, right, bottom) {
    const queryId = ++barbedSpatialQueryId;
    const minCellX = Math.floor(left / BARBED_SPATIAL_CELL_SIZE);
    const maxCellX = Math.floor(right / BARBED_SPATIAL_CELL_SIZE);
    const minCellY = Math.floor(top / BARBED_SPATIAL_CELL_SIZE);
    const maxCellY = Math.floor(bottom / BARBED_SPATIAL_CELL_SIZE);

    for (let cellY = minCellY; cellY <= maxCellY; cellY++) {
        for (let cellX = minCellX; cellX <= maxCellX; cellX++) {
            const bucket = barbedSpatialBuckets.get(getBarbedSpatialKey(cellX, cellY));
            if (!bucket) continue;

            for (const barbed of bucket) {
                if (barbed._spatialQueryId === queryId) continue;
                barbed._spatialQueryId = queryId;
                if (barbed.alive &&
                    barbed.x < right && barbed.right > left &&
                    barbed.y < bottom && barbed.bottom > top) {
                    return true;
                }
            }
        }
    }
    return false;
}

function applyBarbedWireDamage(entity, isPlayerEntity = false) {
    const left = entity.x;
    const top = entity.y;
    const right = entity.right;
    const bottom = entity.bottom;
    const queryId = ++barbedSpatialQueryId;
    const minCellX = Math.floor(left / BARBED_SPATIAL_CELL_SIZE);
    const maxCellX = Math.floor(right / BARBED_SPATIAL_CELL_SIZE);
    const minCellY = Math.floor(top / BARBED_SPATIAL_CELL_SIZE);
    const maxCellY = Math.floor(bottom / BARBED_SPATIAL_CELL_SIZE);

    for (let cellY = minCellY; cellY <= maxCellY; cellY++) {
        for (let cellX = minCellX; cellX <= maxCellX; cellX++) {
            const bucket = barbedSpatialBuckets.get(getBarbedSpatialKey(cellX, cellY));
            if (!bucket) continue;

            for (const barbed of bucket) {
                if (barbed._spatialQueryId === queryId) continue;
                barbed._spatialQueryId = queryId;
                if (barbed.alive &&
                    barbed.x < right && barbed.right > left &&
                    barbed.y < bottom && barbed.bottom > top) {
                    entity.alive = false;
                    soundManager.playSound('death', entity.centerX, entity.centerY);
                    if (isPlayerEntity) gameOver();
                }
            }
        }
    }
}

class Bullet extends Entity {
    constructor(x = 0, y = 0, vx = 0, origin = '', pierce = false) {
        super(x, y, BULLET_WIDTH, BULLET_HEIGHT);
        this.vx = vx;
        this.origin = origin; // 'ally' or 'enemy'
        this.pierce = pierce; // True for charged shot
        this.alive = true; // Used by pool
        this.whizzed = false; // Flag to prevent multiple whiz sounds per bullet
    }

    // Method to re-initialize for pooling
    init(x, y, vx, origin, pierce = false) {
        this.x = x;
        this.y = y;
        this.w = BULLET_WIDTH;
        this.h = BULLET_HEIGHT;
        this.vx = vx;
        this.origin = origin;
        this.pierce = pierce;
        this.alive = true; // Mark as active
        this.whizzed = false; // Reset flag
        return this; // Allow chaining
    }

    update(dt) {
        const dtSec = dt / 1000;
        this.x += this.vx * dtSec;

        // Mark for removal if off-screen
        if (this.x > canvas.width || this.x + this.w < 0) {
            this.alive = false;
        }
    }

    draw() {
        // Bullets don't use sprites in this setup, keep simple drawing
        if (DEBUG_DRAW_HITBOXES) {
             ctx.fillStyle = this.origin === 'ally' ? 'rgba(255, 255, 0, 0.5)' : 'rgba(255, 165, 0, 0.5)'; // Semi-transparent yellow/orange
             ctx.fillRect(this.x, this.y, this.w, this.h);
        } else {
             ctx.fillStyle = this.origin === 'ally' ? 'yellow' : 'orange';
             ctx.fillRect(this.x, this.y, this.w, this.h);
        }
    }
}

class Explosion {
    constructor(x = 0, y = 0) {
        this.x = x;
        this.y = y;
        this.phase = 'shadow'; // 'shadow', 'blast', 'crater'
        this.timer = 0; // Timer within current phase
        this.radius = 10 + randomRange(0,2); // Dynamic radius for shadow/blast effect
        this.alive = true; // Used by pool
        this.craterDuration = 0; // How long the crater has been visible
        this.pts = null;
        this.renderCache = null;
        this.renderCacheOffset = 0;
        this.renderCacheReady = false;
    }

    // Method to re-initialize for pooling
    init(x, y) {
        this.x = x;
        this.y = y;
        this.phase = 'shadow';
        this.timer = 0;
        this.radius = 10 + randomRange(0,2);
        this.alive = true; // Mark as active
        this.craterDuration = 0;

        // --- SOUND: Incoming Shell (if close to player) ---
        if (player && player.alive) {
            const distance = getDistance(player.centerX, player.centerY, this.x, this.y);
            const incomingThreshold = 200; // Distance threshold for hearing incoming shell
            if (distance < incomingThreshold) {
                 soundManager.playSound('incoming', this.x, this.y);
            }
        }

        return this; // Allow chaining
    }

    update(dt) {
        const dtSec = dt / 1000;
        this.timer += dt;

        // défilement (une seule fois) :
        const dx = getCurrentWorldSpeed()*dtSec;
        this.x -= dx;
        if (this.pts) {
            for (const point of this.pts) point.x -= dx;
        }

        // passage blast → crater
        if(this.phase==='blast' && this.timer>=EXPLOSION_BLAST_DURATION){
            this.phase = 'crater';
            this.timer = 0;
            this.craterDuration = 0;
            // Le souffle conserve son rayon de dégâts de 80 px, mais le trou
            // visible reste à l'échelle des soldats et de la vue du dessus.
            this.radius = randomRange(34, 54);

            // ⬇️ AJOUT : on génère la géométrie irrégulière
            const rough  = 0.2;       // même irrégularité douce que le décoratif
            const N      = 32;        // nombre de sommets
            this.pts = [];            // on remplit le tableau
            for (let i = 0; i < N; i++){
                const a   = (i / N) * Math.PI * 2;              // angle
                const off = this.radius * (1 + (Math.random() - .5) * rough);
                this.pts.push({
                    x: this.x + Math.cos(a) * off,
                    y: this.y + Math.sin(a) * off
                });
            }
            queueCraterCache(this);
        }

        if (this.phase === 'shadow') {
            // Shadow grows
            this.radius = 5 + (EXPLOSION_RADIUS - 45) * (this.timer / EXPLOSION_SHADOW_DURATION);
            if (this.timer >= EXPLOSION_SHADOW_DURATION) {
                this.phase = 'blast';
                this.timer = 0;
                this.radius = EXPLOSION_RADIUS; // Blast starts at max radius
                applyBlast(this.x, this.y); // Apply damage/destruction at the center
                // --- SOUND: Explosion Blast ---
                soundManager.playSound('explosion', this.x, this.y);
            }
        } else if (this.phase === 'blast') {
            // Blast effect (could shrink or change alpha/color over duration)
            // For simplicity, let's keep radius constant during blast, just time the phase
             // this.radius = EXPLOSION_RADIUS * (1 - (this.timer / EXPLOSION_BLAST_DURATION)); // Optional shrinking blast visual
            if (this.timer >= EXPLOSION_BLAST_DURATION) {
                this.phase = 'crater';
                this.timer = 0; // Reset timer for crater duration tracking if needed, or use a separate craterDuration
                 this.craterDuration = 0; // Start crater duration timer
            }
        } else if (this.phase === 'crater') {
            // Crater stays visible and scrolls off-screen
            this.craterDuration += dt; // Track how long it's been a crater
        }

        // Mark for removal/pooling if crater is off-screen for a duration
        // Check if the *left edge* of the crater is off-screen left
        if (this.phase === 'crater' && this.x + EXPLOSION_RADIUS < 0 && this.craterDuration >= EXPLOSION_CRATER_DURATION) {
            this.alive = false;
        }
    }

    draw() {
        if (this.phase === 'shadow') {
            const diameter = this.radius * 2;
            ctx.drawImage(
                incomingShadowCanvas,
                this.x - this.radius,
                this.y - this.radius,
                diameter,
                diameter
            );
            return;
        }

        if (this.phase === 'blast') {
            const progress = Math.min(0.999, this.timer / EXPLOSION_BLAST_DURATION);
            const frameIndex = Math.min(
                explosionBlastFrames.length - 1,
                Math.floor(progress * explosionBlastFrames.length)
            );
            const frame = explosionBlastFrames[frameIndex];
            ctx.drawImage(frame, this.x - frame.width * 0.5, this.y - frame.height * 0.5);
            return;
        }

        // 2) Phase « crater » : même rendu que tous les autres cratères.
        drawCrater(ctx, this);
    }
}

// --- Object Pooling Functions ---
function getBullet() {
    if (bulletPool.length > 0) {
        return bulletPool.pop();
    } else {
        // Pool is empty, create a new one (shouldn't happen often if pool size is adequate)
        return new Bullet();
    }
}

function returnBullet(bullet) {
    bullet.alive = false; // Mark as inactive
    bulletPool.push(bullet);
}

function getExplosion() {
     if (explosionPool.length > 0) {
         return explosionPool.pop();
     } else {
         // Pool is empty, create a new one
         return new Explosion();
     }
}

function returnExplosion(explosion) {
     explosion.alive = false; // Mark as inactive
     explosion.pts   = null;   // libère la géométrie
     explosionPool.push(explosion);
}

function getBarbedWire() {
    return barbedWirePool.length > 0
        ? barbedWirePool.pop()
        : Object.create(BarbedWire.prototype);
}

function returnBarbedWire(barbed) {
    barbed.alive = false;
    barbedWirePool.push(barbed);
}

function getEnemy() {
    return enemyPool.length > 0
        ? enemyPool.pop()
        : Object.create(Enemy.prototype);
}

function returnEnemy(enemy) {
    enemy.alive = false;
    enemyPool.push(enemy);
}

function getAlly() {
    return allyPool.length > 0

}

function returnAlly(ally) {

        // ── NOUVEAU ──

        )

    }

        DECORATIVE_CRATER_SPAWN_MIN,

    );

    // Décor léger : davantage d'éléments sur un grand écran, tout en gardant

    const initialDecorationCount = Math.max(
        9,
        Math.min(29, Math.round((canvas.width * canvas.height) / 65000))
    );
    for (let i = 0; i < initialDecorationCount; i++) {

    // Create player
    player = new Player();

    for (let i = 0; i < ALLY_COUNT_INITIAL; i++) {
    allies.push(getAlly().init(
        player.x + randomRange(-5,4),
        (i + 1) * (canvas.height / (ALLY_COUNT_INITIAL + 1)) + randomRange(-5,5)
    ));
    }

    allies.forEach(a => a.isWaiting = true);
    player.isWaiting = true;

    // Reset trench and explosion spawning timers
    nextTrenchX = canvas.width + randomRange(TRENCH_MIN_DIST, TRENCH_MAX_DIST); // First trench appears off-screen
    timeSinceLastExplosion = 0;
    nextExplosionTime = randomRange(EXPLOSION_SPAWN_INTERVAL_MIN, EXPLOSION_SPAWN_INTERVAL_MAX);


  
    // Passage à l'état d'attente de charge
    gameState = 'waitingCharge';
    document.getElementById('message').innerText = navigator.maxTouchPoints > 0
        ? 'Touchez la moitié droite pour lancer la charge'
        : 'Appuyer sur → pour lancer la charge';

    // Lance immédiatement la musique de fond en boucle
    soundManager.playSound('bgMusic');

    // La boucle principale est déjà active depuis l'initialisation. On remet
    // son horloge à zéro et on ne la relance que si elle était arrêtée.
    lastTime = performance.now();
    if (!animationLoopRunning) {
        animationLoopRunning = true;
        requestAnimationFrame(gameLoop);
    }
}
