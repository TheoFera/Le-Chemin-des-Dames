name: Publier le jeu sur GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Déployer le jeu
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v6

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers du site
        shell: bash
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            ./ _site/
          cp _site/game.html _site/index.html

      - name: Envoyer les fichiers du site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
